<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Monologue</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#96262B">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monologue">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#E3DDCB;
    --bg-panel:#F7F3E7;
    --bg-panel-alt:#ECE5D2;
    --bg-input:#EDE6D2;
    --hairline:#C6BC9E;
    --hairline-soft:#DCD4BB;
    --text-primary:#221D16;
    --text-secondary:#6B6151;
    --text-dim:#9A8F76;
    --accent:#96262B;
    --accent-bright:#B22F35;
    --accent-dim:#6E1D22;
    --gold:#A8791C;
    --tier-green:#4B7A3D;
    --tier-gold:#96721B;
    --tier-orange:#B5591C;
    --tier-red:#96262B;
    --paper-white:#F8F4E8;
    --radius:2px;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-base);
    background-image: repeating-linear-gradient(0deg, rgba(34,29,22,0.015) 0 1px, transparent 1px 3px);
    color:var(--text-primary);
    font-family:var(--font-body);
    min-height:100vh;
  }
  .app{max-width:1180px;margin:0 auto;padding:26px 20px 60px;}

  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;border-bottom:2px solid var(--text-primary);padding-bottom:14px;margin-bottom:22px;}
  .brand h1{font-family:var(--font-display);font-weight:600;font-size:33px;letter-spacing:-0.3px;margin:0;line-height:1;color:var(--text-primary);}
  .brand .sub{font-family:var(--font-mono);font-size:10.5px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;margin-top:5px;}

  nav.deck{display:flex;gap:22px;background:transparent;border:none;border-radius:0;padding:0;}
  .deck button{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-dim);padding:0 0 12px;margin-bottom:-16px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .deck button .led{display:none;}
  .deck button.active{color:var(--text-primary);border-bottom-color:var(--accent);}
  .deck button:hover{color:var(--text-primary);}

  .view{display:none;}
  .view.active{display:block;}

  h2.section-title{font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:-0.2px;margin:0 0 16px;color:var(--text-primary);}
  h3.sub-title{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 10px;color:var(--accent);}

  label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);display:block;margin-bottom:5px;}
  input[type=text], input[type=number], textarea, select{
    width:100%;background:var(--bg-input);border:1px solid var(--hairline);color:var(--text-primary);
    font-family:var(--font-body);font-size:14px;padding:9px 10px;border-radius:var(--radius);outline:none;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:56px;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:150px;}

  .toggle-group{display:flex;gap:8px;margin-bottom:16px;}
  .toggle-group button{flex:1;font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:0;padding:11px;background:var(--bg-panel);border:1px solid var(--hairline);color:var(--text-secondary);border-radius:var(--radius);cursor:pointer;}
  .toggle-group button.active{background:var(--accent-dim);border-color:var(--accent);color:var(--paper-white);}

  .card-panel{background:var(--bg-panel);border:1px solid var(--hairline);border-radius:var(--radius);padding:20px;}

  .btn-mini{font-family:var(--font-mono);font-size:11px;background:var(--bg-panel-alt);border:1px solid var(--hairline);color:var(--text-secondary);padding:7px 10px;border-radius:var(--radius);cursor:pointer;}
  .btn-mini:hover{color:var(--text-primary);border-color:var(--accent-dim);}
  .btn-mini.btn-danger:hover{color:var(--accent-bright);border-color:var(--accent);}
  .add-inline{display:flex;gap:6px;margin-top:4px;}
  .add-inline input{flex:1;}

  /* multiselect dropdown */
  .multiselect{position:relative;}
  .multiselect-trigger{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--bg-input);border:1px solid var(--hairline);color:var(--text-primary);font-family:var(--font-body);font-size:14px;padding:9px 10px;border-radius:var(--radius);cursor:pointer;text-align:left;}
  .multiselect-trigger:hover{border-color:var(--accent-dim);}
  .multiselect.open .multiselect-trigger{border-color:var(--accent);}
  .multiselect-trigger .ms-caret{color:var(--text-dim);font-size:11px;margin-left:8px;flex-shrink:0;}
  .ms-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .multiselect-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg-panel);border:1px solid var(--hairline);border-radius:var(--radius);padding:8px;z-index:20;box-shadow:0 10px 24px rgba(34,29,22,0.18);}
  .multiselect.open .multiselect-panel{display:block;}
  .multiselect-options{max-height:220px;overflow-y:auto;}
  .multiselect-option{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:2px;cursor:pointer;font-size:13px;color:var(--text-secondary);}
  .multiselect-option:hover{background:var(--bg-input);}
  .multiselect-option.checked{color:var(--text-primary);}
  .multiselect-option input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;flex-shrink:0;}
  .multiselect .add-inline{margin-top:8px;padding-top:8px;border-top:1px solid var(--hairline-soft);}

  /* meter */
  .meter-wrap{display:flex;align-items:center;gap:9px;min-width:110px;}
  .meter{flex:1;height:8px;background:var(--bg-input);border:1px solid var(--hairline);border-radius:2px;position:relative;overflow:hidden;}
  .meter-fill{height:100%;}
  .meter-num{font-family:var(--font-mono);font-size:13px;font-weight:700;width:36px;text-align:right;}

  /* rating slider (custom track, no native inset) */
  .rating-slider{display:flex;align-items:center;gap:10px;min-width:0;}
  .slider-track-wrap{position:relative;flex:1;min-width:0;height:20px;}
  .slider-track-bg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:6px;border-radius:2px;background:var(--bg-input);border:1px solid var(--hairline);pointer-events:none;}
  .slider-fill-visual{position:absolute;left:0;top:50%;transform:translateY(-50%);height:6px;border-radius:2px;width:0%;pointer-events:none;}
  .slider-thumb-visual{position:absolute;top:50%;left:0%;width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid var(--bg-panel);box-shadow:0 0 0 1px var(--hairline);transform:translate(-50%,-50%);pointer-events:none;}
  .slider-track-wrap input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;z-index:2;}
  .slider-track-wrap{cursor:pointer;}
  .rating-slider .slider-value{font-family:var(--font-mono);font-weight:700;font-size:13.5px;width:36px;text-align:right;flex-shrink:0;}
  .rubric-row{display:grid;grid-template-columns:170px 1fr 40px 32px;gap:10px;align-items:center;margin-bottom:10px;}
  .eleven-btn{background:var(--bg-panel-alt);border:1px solid var(--hairline);border-radius:var(--radius);width:32px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);font-family:var(--font-mono);font-weight:700;font-size:11px;padding:0;}
  .eleven-btn:hover{border-color:var(--accent-dim);color:var(--text-secondary);}
  .eleven-btn.active{background:var(--gold);border-color:var(--gold);color:var(--paper-white);box-shadow:0 0 0 1px rgba(168,121,28,0.35);}
  .rubric-row label{margin:0;}

  .commit-btn{margin-top:18px;width:100%;font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:0;padding:16px;background:var(--accent);border:1px solid var(--accent-bright);color:var(--paper-white);border-radius:var(--radius);cursor:pointer;}
  .commit-btn:hover{background:var(--accent-bright);}
  .commit-btn .hint{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:#EAD3D0;margin-top:3px;text-transform:none;}
  .commit-btn.armed{background:var(--accent-bright);box-shadow:0 0 0 2px rgba(178,47,53,0.3);}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text-primary);border:1px solid var(--text-primary);color:var(--paper-white);font-family:var(--font-mono);font-size:12.5px;padding:11px 18px;border-radius:var(--radius);box-shadow:0 6px 20px rgba(34,29,22,0.25);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}

  .catalog-toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .search-input-wrap{position:relative;margin-bottom:14px;}
  .search-input-wrap input{font-family:var(--font-mono);font-size:15px;padding:13px 13px 13px 38px;background:var(--bg-input);border:1px solid var(--hairline);border-radius:var(--radius);color:var(--text-primary);width:100%;outline:none;}
  .search-input-wrap input:focus{border-color:var(--accent);}
  .search-input-wrap .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:14px;}
  .toolbar-group{display:flex;gap:6px;align-items:center;}
  .toolbar-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-right:2px;}
  .toolbar-select{width:auto;font-family:var(--font-mono);font-size:11px;padding:7px 8px;background:var(--bg-input);border:1px solid var(--hairline);color:var(--text-primary);border-radius:var(--radius);}
  .order-btn{font-family:var(--font-mono);font-size:14px;background:var(--bg-panel-alt);border:1px solid var(--hairline);color:var(--text-secondary);border-radius:var(--radius);padding:6px 10px;cursor:pointer;}
  .filter-chip{font-family:var(--font-mono);font-size:11px;padding:6px 11px;border-radius:12px;border:1px solid var(--hairline);background:var(--bg-panel);color:var(--text-secondary);cursor:pointer;}
  .filter-chip.active{background:var(--accent);border-color:var(--accent);color:var(--paper-white);}

  .poster-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:16px;}
  .tile{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;cursor:pointer;background:var(--bg-panel);border:1px solid var(--hairline);box-shadow:0 1px 2px rgba(34,29,22,0.08);transition:transform .15s, box-shadow .15s;}
  .tile:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(34,29,22,0.18);}
  .tile-poster-wrap{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--bg-input);flex-shrink:0;}
  .tile-poster-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .tile .poster-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--text-dim);}
  .tile-spine{position:absolute;top:8px;left:8px;background:var(--bg-panel);border:1px solid var(--hairline);color:var(--accent);font-family:var(--font-display);font-weight:600;font-size:13px;padding:2px 8px 3px;border-radius:2px;line-height:1.2;box-shadow:0 1px 3px rgba(34,29,22,0.2);}
  .tile-spine .no-label{font-family:var(--font-mono);font-size:7.5px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;display:block;}
  .tile-badge{position:absolute;top:8px;right:8px;font-family:var(--font-mono);font-weight:700;font-size:12px;padding:3px 7px;border-radius:2px;background:var(--bg-panel);border:1px solid var(--hairline);box-shadow:0 1px 3px rgba(34,29,22,0.2);}
  .tile-caption{padding:8px 9px 9px;border-top:1px solid var(--hairline-soft);}
  .tile-title{font-family:var(--font-body);font-weight:600;font-size:12.5px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile-sub{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .watchlist-row{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--hairline);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;}
  .watchlist-row.dragging{opacity:0.4;}
  .watchlist-row.drag-over-top{box-shadow:inset 0 2px 0 var(--accent);}
  .watchlist-row.drag-over-bottom{box-shadow:inset 0 -2px 0 var(--accent);}
  .wl-handle{cursor:grab;color:var(--text-dim);font-size:14px;user-select:none;touch-action:none;}
  .wl-poster{width:42px;height:60px;border-radius:2px;overflow:hidden;background:var(--bg-input);border:1px solid var(--hairline);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .wl-poster img{width:100%;height:100%;object-fit:cover;}
  .wl-info{flex:1;min-width:0;}
  .wl-title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wl-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:2px;}
  .status-badge{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;border-radius:9px;padding:2px 8px;}
  .status-priority{background:#F0D9D6;color:#7A2226;}
  .status-nextwatch{background:#DCE1EC;color:#2B3B52;}
  .status-unwatched{background:var(--bg-panel-alt);color:var(--text-dim);border:1px solid var(--hairline);}
  .status-rewatch{background:#DCE8D2;color:#3E5A2E;}
  .wl-actions{display:flex;gap:6px;flex-shrink:0;}

  .entry-tag{display:inline-block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-dim);border:1px solid var(--hairline-soft);border-radius:9px;padding:1px 7px;margin-right:5px;}
  .empty-note{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);padding:20px 0;text-align:center;}

  .modal-overlay{position:fixed;inset:0;background:rgba(28,24,18,0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal-content{background:var(--bg-panel);border:1px solid var(--hairline);border-radius:var(--radius);max-width:600px;width:100%;max-height:86vh;overflow-y:auto;padding:24px;position:relative;box-shadow:0 20px 50px rgba(34,29,22,0.3);}
  .modal-close{position:absolute;top:12px;right:14px;background:transparent;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;}
  .modal-close:hover{color:var(--text-primary);}
  .modal-poster{width:130px;height:190px;border-radius:var(--radius);border:1px solid var(--hairline);overflow:hidden;background:var(--bg-input);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .modal-poster img{width:100%;height:100%;object-fit:cover;}
  .modal-spine{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
  .modal-title{font-family:var(--font-display);font-weight:600;font-size:23px;letter-spacing:-0.2px;color:var(--text-primary);}
  .modal-sub{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);margin-top:4px;}
  .rubric-breakdown{margin-top:10px;}
  .rb-row{display:grid;grid-template-columns:150px 1fr 42px;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--hairline-soft);font-size:12.5px;}
  .rb-row:last-child{border-bottom:none;}
  .rb-label{color:var(--text-secondary);}
  .rb-meter{position:relative;height:6px;background:var(--bg-input);border:1px solid var(--hairline);border-radius:2px;overflow:hidden;}
  .rb-meter-fill{height:100%;}
  .rb-score{font-family:var(--font-mono);font-weight:700;text-align:right;}
  .modal-section-title{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin:16px 0 8px;}

  ::placeholder{color:var(--text-dim);}

  [data-theme="dark"]{
    --bg-base:#1C1814;
    --bg-panel:#241F19;
    --bg-panel-alt:#2C2620;
    --bg-input:#191510;
    --hairline:#3D362B;
    --hairline-soft:#2C2620;
    --text-primary:#EDE6D3;
    --text-secondary:#A79A80;
    --text-dim:#6E6250;
    --accent:#C23A41;
    --accent-bright:#DA4A52;
    --accent-dim:#5C1A1E;
    --gold:#C99A3E;
    --tier-green:#6FA85C;
    --tier-gold:#C99A3E;
    --tier-orange:#C9762E;
    --tier-red:#C23A41;
    --paper-white:#F5EFE0;
  }
  [data-theme="dark"] body{background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0 1px, transparent 1px 3px);}

  .theme-toggle{font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;background:var(--bg-panel-alt);border:1px solid var(--hairline);color:var(--text-secondary);padding:8px 13px;border-radius:var(--radius);cursor:pointer;height:fit-content;}
  .theme-toggle:hover{color:var(--text-primary);border-color:var(--accent-dim);}
  .nav-cluster{display:flex;align-items:flex-end;gap:16px;}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <h1>Movie Monologue</h1>
      <div class="sub">A Personal Film &amp; Television Archive</div>
    </div>
    <div class="nav-cluster">
      <nav class="deck">
        <button data-view="watchlist" class="active"><span class="led"></span>Watchlist</button>
        <button data-view="search"><span class="led"></span>Search</button>
        <button data-view="rate"><span class="led"></span>Rate New</button>
        <button data-view="catalog"><span class="led"></span>Catalog</button>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button"><span id="themeToggleLabel">Dark</span></button>
    </div>
  </header>

  <!-- WATCHLIST -->
  <section class="view active" id="view-watchlist">
    <h2 class="section-title">Watchlist</h2>
    <div class="catalog-toolbar">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="filter-chip active" data-wlstatus="all">All</button>
        <button class="filter-chip" data-wlstatus="priority">Priority</button>
        <button class="filter-chip" data-wlstatus="nextwatch">Next Watch</button>
        <button class="filter-chip" data-wlstatus="unwatched">Unwatched</button>
        <button class="filter-chip" data-wlstatus="rewatch">Re-watch</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <div class="multiselect" id="wlGenreMultiselect" style="width:180px;">
          <button type="button" class="multiselect-trigger" id="wlGenreTrigger">
            <span class="ms-label" id="wlGenreTriggerLabel">Filter genre...</span>
            <span class="ms-caret">&#9662;</span>
          </button>
          <div class="multiselect-panel">
            <div class="multiselect-options" id="wlGenreOptions"></div>
          </div>
        </div>
        <div class="multiselect" id="wlPlatformMultiselect" style="width:180px;">
          <button type="button" class="multiselect-trigger" id="wlPlatformTrigger">
            <span class="ms-label" id="wlPlatformTriggerLabel">Filter platform...</span>
            <span class="ms-caret">&#9662;</span>
          </button>
          <div class="multiselect-panel">
            <div class="multiselect-options" id="wlPlatformOptions"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="watchlistItems"></div>
  </section>

  <!-- SEARCH -->
  <section class="view" id="view-search">
    <h2 class="section-title">Search</h2>
    <div class="search-input-wrap">
      <span class="icon">&#9679;</span>
      <input type="text" id="searchInput" placeholder="Search by title, director, or actor...">
    </div>
    <div class="catalog-toolbar">
      <div style="display:flex;gap:8px;">
        <button class="filter-chip active" data-scope="all">All</button>
        <button class="filter-chip" data-scope="watchlist">Watchlist</button>
        <button class="filter-chip" data-scope="catalog">Catalog</button>
      </div>
      <div class="toolbar-group" id="searchSortGroup">
        <span class="toolbar-label">Sort Catalog By</span>
        <select class="toolbar-select" id="searchSortSelect"></select>
        <button class="order-btn" id="searchOrderBtn" title="Toggle order">&#8595;</button>
      </div>
    </div>
    <div id="searchResults"></div>
  </section>

  <!-- RATE NEW -->
  <section class="view" id="view-rate">
    <h2 class="section-title">Add / Rate</h2>

      <div class="row">

        <div id="rubricRows"></div>

        <div class="row" style="margin-top:6px;">
          <div class="field" style="max-width:260px;">
            <label>Personal Bonus</label>
            <div class="rating-slider">
              <div class="slider-track-wrap">
                <input type="range" id="personalBonus" min="-2" max="2" step="0.5" value="0">
                <div class="slider-track-bg"></div>
                <div class="slider-fill-visual"></div>
                <div class="slider-thumb-visual"></div>

<script>
(function(){
  const DEFAULT_GENRES = ["Drama","Action","Thriller","War","Biography","Crime","Sci-Fi","Comedy","Adventure","Historical","Romance","Mystery","Sports","Western","Animation","Documentary","Fantasy","Horror"];
  const DEFAULT_PLATFORMS = ["Netflix","HBO Max","Hulu","Prime Video","Disney+","Apple TV+","Theater","Paramount+","Peacock","Physical Media"];

  const RUBRIC_KEYS = [
    ['acting','Acting & Performances'],
    ['writing','Writing & Story'],
    ['direction','Direction & Vision'],
    ['cinematography','Cinematography & Visuals'],
    ['score','Score & Sound Design'],
    ['pacing','Pacing & Structure'],
    ['ending','Ending / Resolution'],
    ['emotional','Emotional Impact']
  ];
  const ALL_KEYS = RUBRIC_KEYS.map(k=>k[0]);

  const STATUS_LABELS = { unwatched:'Unwatched', priority:'Priority', nextwatch:'Next Watch', rewatch:'Re-watch', completed:'Completed' };
  const STATUS_ORDER = { priority:0, nextwatch:1, rewatch:2, unwatched:3 };

  let entries = [];
  let tags = { genres:[...DEFAULT_GENRES], platforms:[...DEFAULT_PLATFORMS] };
  let selectedGenres = [];
  let selectedPlatforms = [];
  let entryType = 'movie';
  let editingId = null;
  let catalogFilter = 'all';
  let wlStatusFilter = 'all';
  let wlGenreFilter = [];
  let wlPlatformFilter = [];
  let searchScope = 'all';
  let searchSortKey = 'overall';
  let searchSortOrder = 'desc';

  const $ = (id) => document.getElementById(id);

  // ---------- storage ----------
  // ---------- storage (Supabase) ----------
  const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadData(){
    try{
      const { data, error } = await sb.from('monologue_entries').select('data');
      if(error) throw error;
      entries = (data || []).map(row => row.data);
    }catch(err){
      console.error('load entries failed', err);
      entries = [];
      showToast('Could not reach the sync server — check your connection.');
    }
    try{
      const { data, error } = await sb.from('monologue_tags').select('data').eq('id', 'singleton').maybeSingle();
      if(error) throw error;
      if(data && data.data){
        const parsed = data.data;
        tags.genres = Array.from(new Set([...DEFAULT_GENRES, ...(parsed.genres||[])]));
        tags.platforms = Array.from(new Set([...DEFAULT_PLATFORMS, ...(parsed.platforms||[])]));
      }
    }catch(err){ /* keep defaults */ }
    await seedDemoIfEmpty();
    renderGenreOptions();
    renderPlatformOptions();
    renderWlGenreOptions();
    renderWlPlatformOptions();
    renderWatchlist();
    renderCatalog();
  }
  async function seedDemoIfEmpty(){
    if(entries.length > 0) return;
    const omdb = await fetchOMDb('Whiplash', 'movie');
    const rubric = { acting:11, writing:9, direction:9, cinematography:9, score:10, pacing:10, ending:9, emotional:9 };
    const sum = Object.values(rubric).reduce((a,b)=>a+b, 0);
    const personalBonus = 0.5;
    const overall = (sum / 8) + personalBonus;
    const demo = {
      id: 'mov_demo_whiplash',
      catalogNumber: 1,
      kind: 'movie',
      title: 'Whiplash',
      genres: ['Drama'],
      platforms: ['Netflix'],
      status: 'completed',
      posterUrl: omdb && omdb.Poster && omdb.Poster !== 'N/A' ? omdb.Poster : '',
      director: omdb && omdb.Director && omdb.Director !== 'N/A' ? omdb.Director : 'Damien Chazelle',
      actors: omdb && omdb.Actors && omdb.Actors !== 'N/A' ? omdb.Actors.split(',').map(s=>s.trim()) : ['Miles Teller','J.K. Simmons'],
      notes: 'Demo entry so you can see a fully filled-out rating without re-entering everything. Edit or delete it any time.',
      runtime: '106',
      tvStatus: '',
      rubric,
      personalBonus,
      overall,
      dateAdded: Date.now(),
      rank: 0
    };
    entries.push(demo);
    await saveEntries();
  }
  async function saveEntries(){
    try{
      if(!entries.length) return;
      const rows = entries.map(e => ({ id: e.id, data: e, updated_at: new Date().toISOString() }));
      const { error } = await sb.from('monologue_entries').upsert(rows);
      if(error) throw error;
    }catch(err){
      console.error('save entries failed', err);
      showToast('Save failed — check your connection.');
    }
  }
  async function saveTags(){
    try{
      const { error } = await sb.from('monologue_tags').upsert({ id: 'singleton', data: tags, updated_at: new Date().toISOString() });
      if(error) throw error;
    }catch(err){ console.error('save tags failed', err); }
  }
  async function deleteEntryRemote(id){
    try{
      const { error } = await sb.from('monologue_entries').delete().eq('id', id);
      if(error) throw error;
    }catch(err){
      console.error('remote delete failed', err);
      showToast('Delete may not have synced — check your connection.');
    }
  }
  async function syncEntriesFull(){
    try{
      const { data, error } = await sb.from('monologue_entries').select('id');
      if(error) throw error;
      const remoteIds = (data || []).map(r => r.id);
      const localIds = new Set(entries.map(e => e.id));
      const toDelete = remoteIds.filter(id => !localIds.has(id));
      if(toDelete.length){
        await sb.from('monologue_entries').delete().in('id', toDelete);
      }
      await saveEntries();
    }catch(err){ console.error('full sync failed', err); }
  }

  function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }
  function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function showToast(msg, duration){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), duration || 2200);
  }

  // ---------- nav ----------
  document.querySelectorAll('.deck button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.deck button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      $('view-' + btn.dataset.view).classList.add('active');
      if(btn.dataset.view === 'catalog') renderCatalog();
      if(btn.dataset.view === 'watchlist') renderWatchlist();
      if(btn.dataset.view === 'search') runSearch();
    });
  });

  // ---------- type toggle ----------
  $('typeToggle').addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    entryType = btn.dataset.type;
    document.querySelectorAll('#typeToggle button').forEach(b=>b.classList.toggle('active', b===btn));
    updateFormMode();
  });
  function updateFormMode(){
    const isMovie = entryType === 'movie';
    $('runtimeField').style.display = isMovie ? 'block' : 'none';
    $('tvStatusField').style.display = isMovie ? 'none' : 'block';
  }
  $('entryStatus').addEventListener('change', ()=>{
    $('rubricSection').style.display = $('entryStatus').value === 'completed' ? 'block' : 'none';
  });

  // ---------- poster preview ----------
  $('posterUrlInput').addEventListener('input', ()=>{
    const val = $('posterUrlInput').value.trim();
    const img = $('posterPreviewImg'), ph = $('posterPlaceholder');
    if(val){ img.src = val; img.style.display='block'; ph.style.display='none'; }
    else { img.style.display='none'; ph.style.display='block'; }
  });

  // ---------- OMDb auto-fetch (poster, director, actors) ----------
  const OMDB_API_KEY = '9602b4c4';

  async function fetchOMDb(title, type){
    try{
      const q = encodeURIComponent(title);
      const typeParam = type === 'tv' ? 'series' : 'movie';
      const url = `https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&t=${q}&type=${typeParam}`;
      const res = await fetch(url);
      const data = await res.json();
      return data && data.Response === 'True' ? data : null;
    }catch(err){
      return null;
    }
  }

  async function attemptPosterFetch(){
    const title = $('entryTitle').value.trim();
    if(!title){
      $('posterFetchStatus').textContent = 'Fill in a title to auto-fetch poster & director.';
      return;
    }
    $('posterFetchStatus').textContent = 'Looking up "' + title + '"...';
    const data = await fetchOMDb(title, entryType);
    if(!data){
      $('posterFetchStatus').textContent = 'No match found — fill in manually if you have the details.';
      return;
    }
    let filled = [];
    if(data.Poster && data.Poster !== 'N/A'){
      $('posterUrlInput').value = data.Poster;
      $('posterUrlInput').dispatchEvent(new Event('input'));
      filled.push('poster');
    }
    if(data.Director && data.Director !== 'N/A'){
      $('entryDirector').value = data.Director;
      filled.push('director');
    }
    if(data.Actors && data.Actors !== 'N/A'){
      $('entryActors').value = data.Actors;
      filled.push('actors');
    }
    $('posterFetchStatus').textContent = filled.length
      ? 'Found a match — filled in ' + filled.join(', ') + '. Double-check before saving.'
      : 'Found a match, but it had no poster/director/actor data.';
  }
  $('entryTitle').addEventListener('blur', attemptPosterFetch);
  $('retryPosterBtn').addEventListener('click', attemptPosterFetch);

  // ---------- genre multiselect ----------
  function renderGenreOptions(){
    const wrap = $('genreOptions'); wrap.innerHTML = '';
    tags.genres.forEach(g=>{
      const opt = document.createElement('label');
      opt.className = 'multiselect-option' + (selectedGenres.includes(g) ? ' checked' : '');
      const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = selectedGenres.includes(g);
      cb.addEventListener('change', ()=>{
        if(cb.checked){ if(!selectedGenres.includes(g)) selectedGenres.push(g); }
        else { selectedGenres = selectedGenres.filter(x=>x!==g); }
        opt.classList.toggle('checked', cb.checked);
        updateGenreLabel();
      });
      opt.appendChild(cb); opt.appendChild(document.createTextNode(g));
      wrap.appendChild(opt);
    });
  }
  function updateGenreLabel(){
    $('genreTriggerLabel').textContent = selectedGenres.length ? selectedGenres.join(', ') : 'Select genres...';
  }
  $('genreTrigger').addEventListener('click', (e)=>{ e.stopPropagation(); $('genreMultiselect').classList.toggle('open'); });
  $('addGenreBtn').addEventListener('click', (e)=>{
    e.stopPropagation();
    const val = $('newGenreInput').value.trim();
    if(!val) return;
    if(!tags.genres.includes(val)) tags.genres.push(val);
    if(!selectedGenres.includes(val)) selectedGenres.push(val);
    $('newGenreInput').value = '';
    saveTags(); renderGenreOptions(); updateGenreLabel();
    renderWlGenreOptions();
  });

  // ---------- platform multiselect ----------
  function renderPlatformOptions(){
    const wrap = $('platformOptions'); wrap.innerHTML = '';
    tags.platforms.forEach(p=>{
      const opt = document.createElement('label');
      opt.className = 'multiselect-option' + (selectedPlatforms.includes(p) ? ' checked' : '');
      const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = selectedPlatforms.includes(p);
      cb.addEventListener('change', ()=>{
        if(cb.checked){ if(!selectedPlatforms.includes(p)) selectedPlatforms.push(p); }
        else { selectedPlatforms = selectedPlatforms.filter(x=>x!==p); }
        opt.classList.toggle('checked', cb.checked);
        updatePlatformLabel();
      });
      opt.appendChild(cb); opt.appendChild(document.createTextNode(p));
      wrap.appendChild(opt);
    });
  }
  function updatePlatformLabel(){
    $('platformTriggerLabel').textContent = selectedPlatforms.length ? selectedPlatforms.join(', ') : 'Select platforms...';
  }
  $('platformTrigger').addEventListener('click', (e)=>{ e.stopPropagation(); $('platformMultiselect').classList.toggle('open'); });
  $('addPlatformBtn').addEventListener('click', (e)=>{
    e.stopPropagation();
    const val = $('newPlatformInput').value.trim();
    if(!val) return;
    if(!tags.platforms.includes(val)) tags.platforms.push(val);
    if(!selectedPlatforms.includes(val)) selectedPlatforms.push(val);
    $('newPlatformInput').value = '';
    saveTags(); renderPlatformOptions(); updatePlatformLabel();
    renderWlPlatformOptions();
  });

  document.addEventListener('click', (e)=>{
    ['genreMultiselect','platformMultiselect','wlGenreMultiselect','wlPlatformMultiselect'].forEach(id=>{
      const ms = $(id);
      if(ms.classList.contains('open') && !ms.contains(e.target)) ms.classList.remove('open');
    });
  });

  // ---------- tier color ----------
  function tierColor(score){
    if(score >= 9.0) return 'var(--tier-green)';
    if(score >= 7.5) return 'var(--tier-gold)';
    if(score >= 6.0) return 'var(--tier-orange)';
    return 'var(--tier-red)';
  }
  function tierColorResolved(score){
    if(score >= 9.0) return getCss('--tier-green');
    if(score >= 7.5) return getCss('--tier-gold');
    if(score >= 6.0) return getCss('--tier-orange');
    return getCss('--tier-red');
  }
  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function meterHTML(score){
    const s = Math.max(0, score);
    const pct = Math.min(100, (s/10)*100);
    const color = tierColorResolved(s);
    return `<div class="meter-wrap"><div class="meter"><div class="meter-fill" style="width:${pct}%;background:${color};"></div></div><div class="meter-num" style="color:${color};">${s.toFixed(1)}</div></div>`;
  }

  // ---------- rubric sliders ----------
  function updateSliderFill(input){
    const val = parseFloat(input.value) || 0;
    const min = parseFloat(input.min) || 0;
    const max = parseFloat(input.max) || 10;
    const pct = ((val - min) / (max - min)) * 100;
    const color = tierColorResolved(Math.min(val,10));
    const wrap = input.closest('.slider-track-wrap');
    if(!wrap) return;
    const fill = wrap.querySelector('.slider-fill-visual');
    const thumb = wrap.querySelector('.slider-thumb-visual');
    if(fill){ fill.style.width = pct + '%'; fill.style.background = color; }
    if(thumb){ thumb.style.left = pct + '%'; }
  }
  function wireDrag(wrap, input){
    function valFromX(clientX){
      const rect = wrap.getBoundingClientRect();
      const min = parseFloat(input.min)||0, max = parseFloat(input.max)||10, step = parseFloat(input.step)||1;
      let pct = rect.width>0 ? (clientX-rect.left)/rect.width : 0;
      pct = Math.max(0, Math.min(1, pct));
      let val = min + pct*(max-min);
      val = Math.round(val/step)*step;
      return Math.max(min, Math.min(max, Math.round(val*100)/100));
    }
    function setFromX(clientX){
      const val = valFromX(clientX);
      if(parseFloat(input.value) !== val){ input.value = val; input.dispatchEvent(new Event('input', {bubbles:true})); }
    }
    function onMove(e){ setFromX(e.touches ? e.touches[0].clientX : e.clientX); }
    function onUp(){ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
    wrap.addEventListener('mousedown', (e)=>{ setFromX(e.clientX); document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp); e.preventDefault(); });
    wrap.addEventListener('touchstart', (e)=>{ setFromX(e.touches[0].clientX); }, {passive:true});
  }
  function wireRatingSlider(input, display, onChange){
    const wrap = input.closest('.slider-track-wrap');
    const key = input.dataset.key;
    const sync = ()=>{
      const raw = parseFloat(input.value) || 0;
      const boosted = raw + (key && elevenState[key] ? 1 : 0);
      if(display){
        display.textContent = boosted.toFixed(1);
        display.style.color = (key && elevenState[key]) ? 'var(--gold)' : '';
      }
      updateSliderFill(input);
      if(onChange) onChange();
    };
    input.addEventListener('input', sync);
    if(wrap) wireDrag(wrap, input);
    sync();
  }
  let elevenState = {};
  RUBRIC_KEYS.forEach(([k])=> elevenState[k] = false);

  function sliderRowHTML(key, label){
    return `<div class="rubric-row">
      <label>${label}</label>
      <div class="slider-track-wrap">
        <input type="range" class="rubric-input" data-key="${key}" min="0" max="10" step="1" value="0">
        <div class="slider-track-bg"></div>
        <div class="slider-fill-visual"></div>
        <div class="slider-thumb-visual"></div>
      </div>
      <span class="slider-value rubric-value" data-key="${key}">0.0</span>
      <button type="button" class="eleven-btn" data-key="${key}" title="Push this category to 11 — reserve for the truly exceptional">11</button>
    </div>`;
  }
  $('rubricRows').innerHTML = RUBRIC_KEYS.map(([k,l])=> sliderRowHTML(k,l)).join('');
  document.querySelectorAll('.rubric-input').forEach(input=>{
    const key = input.dataset.key;
    const display = document.querySelector(`.rubric-value[data-key="${key}"]`);
    wireRatingSlider(input, display, updateOverallPreview);
  });
  document.querySelectorAll('.eleven-btn').forEach(btn=>{
    const key = btn.dataset.key;
    btn.addEventListener('click', ()=>{
      elevenState[key] = !elevenState[key];
      applyElevenState(key);
      updateOverallPreview();
    });
  });
  function applyElevenState(key){
    const input = document.querySelector(`.rubric-input[data-key="${key}"]`);
    const btn = document.querySelector(`.eleven-btn[data-key="${key}"]`);
    const active = elevenState[key];
    btn.classList.toggle('active', active);
    btn.title = active ? 'Bumped to 11 — click to undo' : 'Push this category to 11 — reserve for the truly exceptional';
    input.dispatchEvent(new Event('input', {bubbles:true}));
  }
  function rubricEffectiveValue(key){
    const input = document.querySelector(`.rubric-input[data-key="${key}"]`);
    const raw = parseFloat(input ? input.value : 0) || 0;
    return raw + (elevenState[key] ? 1 : 0);
  }
  function wirePersonalBonusSlider(){
    const input = $('personalBonus');
    const display = $('personalBonusValue');
    const wrap = input.closest('.slider-track-wrap');
    const min = -2, max = 2;
    function sync(){
      const val = parseFloat(input.value) || 0;
      display.textContent = (val > 0 ? '+' : '') + val.toFixed(1);
      const pct = ((val - min) / (max - min)) * 100;
      const fill = wrap.querySelector('.slider-fill-visual');
      const thumb = wrap.querySelector('.slider-thumb-visual');
      const color = val >= 0 ? 'var(--gold)' : 'var(--accent)';
      fill.style.width = pct + '%';
      fill.style.background = color;
      thumb.style.left = pct + '%';
      updateOverallPreview();
    }
    input.addEventListener('input', sync);
    wireDrag(wrap, input);
    sync();
  }
  wirePersonalBonusSlider();

  function computeOverall(){
    let sum = 0;
    ALL_KEYS.forEach(k=>{
      sum += rubricEffectiveValue(k);
    });
    const avg = sum / ALL_KEYS.length;
    const bonus = parseFloat($('personalBonus').value) || 0;
    return avg + bonus;
  }
  function updateOverallPreview(){
    const overall = computeOverall();
    const color = tierColorResolved(Math.max(0,Math.min(10,overall)));
    $('overallFill').style.width = Math.max(0,Math.min(100,(overall/10)*100)) + '%';
    $('overallFill').style.background = color;
    $('overallNum').style.color = color;
    $('overallNum').textContent = overall.toFixed(1);

  // ---------- commit ----------
  const commitBtn = $('commitBtn');
  let armTimer = null;
  commitBtn.addEventListener('click', ()=>{

  function getNextCatalogNumber(){
    const nums = entries.filter(e=>e.catalogNumber).map(e=>e.catalogNumber);
    return nums.length ? Math.max(...nums) + 1 : 1;
  }

  function commitEntry(){
    const title = $('entryTitle').value.trim();
    if(!title){ showToast('Title is required.'); return; }

    const normalizedTitle = title.toLowerCase();
    const duplicate = entries.find(x =>
      x.kind === entryType &&
      x.title.trim().toLowerCase() === normalizedTitle &&
      x.id !== editingId
    );
    if(duplicate){
      showToast('"' + duplicate.title + '" is already in your ' + (duplicate.status==='completed' ? 'catalog' : 'watchlist') + '. If this is intentionally different (a remake, etc.), adjust the title — e.g. add the year — to save it.', 4200);
      return;
    }

    const status = $('entryStatus').value;
    const newEntry = {
      kind: entryType,
      title,
      genres: [...selectedGenres],
      platforms: [...selectedPlatforms],
      status,
      posterUrl: $('posterUrlInput').value.trim(),
      director: $('entryDirector').value.trim(),
      actors: $('entryActors').value.split(',').map(s=>s.trim()).filter(Boolean),
      notes: $('entryNotes').value.trim(),
      runtime: entryType==='movie' ? $('entryRuntime').value.trim() : '',
      tvStatus: entryType==='tv' ? $('tvStatus').value : ''
    };
    if(status === 'completed'){
      const rubric = {};
      ALL_KEYS.forEach(k=>{
        rubric[k] = rubricEffectiveValue(k);
      });
      newEntry.rubric = rubric;
      newEntry.personalBonus = parseFloat($('personalBonus').value) || 0;
      newEntry.overall = computeOverall();
      const existingForNumber = editingId ? entries.find(x=>x.id===editingId) : null;
      newEntry.catalogNumber = (existingForNumber && existingForNumber.catalogNumber) ? existingForNumber.catalogNumber : getNextCatalogNumber();
    }

    let wasEditing = false;
    if(editingId){
      const idx = entries.findIndex(x=>x.id===editingId);
      if(idx>-1){
        newEntry.id = entries[idx].id;
        newEntry.dateAdded = entries[idx].dateAdded;
        newEntry.rank = entries[idx].rank;
        entries[idx] = newEntry;
      }
      wasEditing = true; editingId = null; exitEditUI();
    } else {
      newEntry.id = (entryType==='movie'?'mov_':'tv_') + Date.now() + '_' + Math.random().toString(36).slice(2,6);
      newEntry.dateAdded = Date.now();
      newEntry.rank = entries.length;
      entries.push(newEntry);
    }
    resetForm();
    saveEntries();
    renderWatchlist();
    renderCatalog();
    showToast(wasEditing ? 'Updated.' : 'Saved.');
  }

  function exitEditUI(){

    $('commitHint').textContent = 'double-click to confirm';
    $('cancelEditBtn').style.display = 'none';

  function resetForm(){

  let dragSrcRow = null;
  function wireWatchlistDrag(row){
    const handle = row.querySelector('.wl-handle');
    handle.addEventListener('dragstart', ()=>{ dragSrcRow = row; row.classList.add('dragging'); });
    handle.addEventListener('dragend', ()=>{
      row.classList.remove('dragging');
      $('watchlistItems').querySelectorAll('.watchlist-row').forEach(r=>r.classList.remove('drag-over-top','drag-over-bottom'));
      dragSrcRow = null;
      persistWatchlistOrder();
    });
    row.addEventListener('dragover', (e)=>{
      if(!dragSrcRow || dragSrcRow===row) return;
      e.preventDefault();
      const rect = row.getBoundingClientRect();
      const before = (e.clientY-rect.top) < rect.height/2;
      row.classList.toggle('drag-over-top', before);
      row.classList.toggle('drag-over-bottom', !before);
    });
    row.addEventListener('dragleave', ()=> row.classList.remove('drag-over-top','drag-over-bottom'));
    row.addEventListener('drop', (e)=>{
      if(!dragSrcRow || dragSrcRow===row) return;
      e.preventDefault();
      const rect = row.getBoundingClientRect();
      const before = (e.clientY-rect.top) < rect.height/2;
      row.classList.remove('drag-over-top','drag-over-bottom');
      if(before) row.parentNode.insertBefore(dragSrcRow, row);
      else row.parentNode.insertBefore(dragSrcRow, row.nextSibling);
    });
  }
  function persistWatchlistOrder(){
    const visibleIds = [...$('watchlistItems').querySelectorAll('.watchlist-row')].map(r=>r.dataset.id);
    const fullList = entries.filter(e=>e.status!=='completed').sort((a,b)=>(a.rank||0)-(b.rank||0));
    const visibleSet = new Set(visibleIds);
    const byId = {};
    fullList.forEach(e=> byId[e.id] = e);
    const slots = [];
    fullList.forEach((e,i)=>{ if(visibleSet.has(e.id)) slots.push(i); });
    slots.forEach((slotIndex, i)=>{ fullList[slotIndex] = byId[visibleIds[i]]; });
    fullList.forEach((e,i)=>{ e.rank = i; });
    saveEntries();
  }

  // ---------- search ----------

  $('searchInput').addEventListener('input', runSearch);

  function runSearch(){
    const q = $('searchInput').value.trim().toLowerCase();
    const container = $('searchResults');

    let pool = entries.slice();
    if(searchScope === 'watchlist') pool = pool.filter(e=>e.status!=='completed');
    else if(searchScope === 'catalog') pool = pool.filter(e=>e.status==='completed');

    if(q){
      pool = pool.filter(e=>{
        const inTitle = e.title.toLowerCase().includes(q);
        const inDirector = (e.director||'').toLowerCase().includes(q);
        const inActors = (e.actors||[]).some(a=>a.toLowerCase().includes(q));
        return inTitle || inDirector || inActors;
      });
    }

    if(!q && searchScope==='all'){
      container.innerHTML = '<div class="empty-note">Type to search, or pick a scope above to browse.</div>';
      return;
    }

    if(searchScope !== 'watchlist'){
      const scored = pool.filter(e=>e.status==='completed');
      const unscored = pool.filter(e=>e.status!=='completed');
      scored.sort((a,b)=>{
        const av = searchSortKey==='overall' ? (a.overall||0) : ((a.rubric&&a.rubric[searchSortKey])||0);
        const bv = searchSortKey==='overall' ? (b.overall||0) : ((b.rubric&&b.rubric[searchSortKey])||0);
        return searchSortOrder==='asc' ? av-bv : bv-av;
      });
      pool = scored.concat(unscored);
    }

    if(pool.length===0){
      container.innerHTML = '<div class="empty-note">No matches.</div>';
      return;
    }
    container.innerHTML = pool.map(searchResultRowHTML).join('');

      });
    });
  }

  $('importBtn').addEventListener('click', ()=> $('importFileInput').click());

  // ---------- modal ----------
  function openModal(id){
    const e = entries.find(x=>x.id===id);

    const poster = e.posterUrl ? `<img src="${escapeAttr(e.posterUrl)}" alt="">` : `<span style="font-size:32px;color:var(--text-dim);">&#127916;</span>`;
    const rubricRows = e.rubric ? ALL_KEYS.map(k=>{
      const label = RUBRIC_KEYS.find(x=>x[0]===k)[1];
      const score = e.rubric[k] || 0;

      return `<div class="rb-row">

      </div>`;
    }).join('') : '';
    const subParts = [e.kind==='movie'?'Movie':'TV Show'];
    if(e.kind==='movie' && e.runtime) subParts.push(e.runtime + ' min');
    if(e.kind==='tv' && e.tvStatus) subParts.push(e.tvStatus);
    if(e.genres && e.genres.length) subParts.push(e.genres.join(', '));
    if(e.platforms && e.platforms.length) subParts.push(e.platforms.join(', '));
    const creditParts = [];
    if(e.director) creditParts.push('Dir. ' + escapeHtml(e.director));
    if(e.actors && e.actors.length) creditParts.push('Starring ' + escapeHtml(e.actors.join(', ')));

    $('modalContent').innerHTML = `
      <button class="modal-close" id="modalCloseBtn">&times;</button>
      <div class="modal-poster">${poster}</div>
      ${e.catalogNumber ? `<div class="modal-spine">No. ${String(e.catalogNumber).padStart(3,'0')}</div>` : ''}
      <div class="modal-title">${escapeHtml(e.title)}</div>
      <div class="modal-sub">${escapeHtml(subParts.join(' \u00b7 '))}</div>
      ${creditParts.length ? `<div class="modal-sub" style="margin-top:2px;">${creditParts.join(' \u00b7 ')}</div>` : ''}
      <button type="button" class="btn-mini" id="editEntryBtn" style="margin-top:10px;">Edit</button>
      <button type="button" class="btn-mini btn-danger" id="deleteEntryBtn" style="margin-top:10px;margin-left:8px;">Delete</button>

      <div style="margin-top:14px;">${meterHTML(e.overall||0)}</div>
      ${e.personalBonus ? `<div class="entry-tag" style="margin-top:6px;">Personal bonus: ${e.personalBonus>0?'+':''}${e.personalBonus}</div>` : ''}
      ${rubricRows ? `<div class="modal-section-title">Rubric Breakdown</div><div class="rubric-breakdown">${rubricRows}</div>` : ''}

      ${e.notes ? `<div class="modal-section-title">Notes</div><div style="font-size:13px;color:var(--text-secondary);line-height:1.5;">${escapeHtml(e.notes)}</div>` : ''}
    `;
    $('modalOverlay').classList.add('show');
    $('modalCloseBtn').addEventListener('click', closeModal);
    $('editEntryBtn').addEventListener('click', ()=> startEdit(id));
    $('deleteEntryBtn').addEventListener('click', ()=> deleteEntry(id));
  }
  function closeModal(){ $('modalOverlay').classList.remove('show'); $('modalContent').innerHTML=''; }
  $('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

  // ---------- theme (device-local, not synced) ----------
  function applyTheme(theme){
    if(theme === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      $('themeToggleLabel').textContent = 'Light';
    } else {
      document.documentElement.removeAttribute('data-theme');
      $('themeToggleLabel').textContent = 'Dark';
    }
  }
  function loadTheme(){
    try{
      applyTheme(localStorage.getItem('monologue-theme') || 'light');
    }catch(err){ applyTheme('light'); }
  }
  $('themeToggle').addEventListener('click', ()=>{
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('monologue-theme', next); }catch(err){}
  });

  // ---------- init ----------
  updateFormMode();
  loadTheme();
  loadData();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
