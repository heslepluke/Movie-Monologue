<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movie Monologue</title>
<meta name="theme-color" content="#f3ede1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monologue">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ede1;--paper-2:#ebe3d3;--card:#faf6ee;--ink:#1d1a16;--ink-2:#5b544a;--ink-3:#8d8579;
  --rule:#d6ccb8;--accent:#9b1c1c;--accent-ink:#fff8f0;--good:#2f6b3a;--gold:#a87412;--warn:#b5521b;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px -12px rgba(60,40,10,.25);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
[data-theme=dark]{
  --paper:#16130f;--paper-2:#1f1b16;--card:#211d17;--ink:#ece4d3;--ink-2:#b9af9d;--ink-3:#857c6d;
  --rule:#3a332a;--accent:#d2504a;--accent-ink:#1a0f0d;--good:#6fb27b;--gold:#d9a645;--warn:#e08a55;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* masthead */
header.mast{border-bottom:2px solid var(--ink);padding:28px 0 0;position:sticky;top:0;background:var(--paper);z-index:20}
.mast-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-weight:700;font-size:44px;line-height:.95;margin:0;letter-spacing:-.01em;font-variation-settings:"opsz" 144}
.brand h1 em{font-style:italic;font-weight:400;color:var(--accent)}
.brand .sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);margin-top:8px}
.mast-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:transparent;padding:8px 14px;border-radius:2px;font-size:13px;font-weight:500;letter-spacing:.02em;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{background:var(--paper-2);color:var(--ink)}
.btn.small{padding:5px 10px;font-size:12px}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.btn.danger:hover{background:var(--accent);color:var(--accent-ink)}
.btn.nudge{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.mast-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px;flex-wrap:wrap}
.tabs{display:flex;gap:2px}
.tab{background:none;border:none;padding:10px 14px 12px;font-family:var(--serif);font-size:19px;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--sans);font-size:11px;color:var(--ink-3);margin-left:6px;vertical-align:2px}
.search{flex:1;max-width:340px;min-width:180px;border:none;border-bottom:1px solid var(--rule);background:transparent;padding:8px 2px;outline:none}
.search:focus{border-bottom-color:var(--ink)}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:18px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sel{border:1px solid var(--rule);background:var(--card);padding:6px 8px;border-radius:2px;font-size:12px}
.spacer{flex:1}
.count{font-size:12px;color:var(--ink-3)}

/* catalogue grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:28px 22px;padding:16px 0 80px}
.card{background:none;border:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:9px}
.cover{position:relative;aspect-ratio:2/3;background:var(--paper-2);box-shadow:var(--shadow);overflow:hidden}
.cover img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.card:hover .cover{transform:translateY(-2px);transition:transform .15s}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px;color:#f6efe2}
.ph .t{font-family:var(--serif);font-size:20px;line-height:1.08;font-weight:600}
.ph .y{font-size:11px;letter-spacing:.18em;opacity:.8}
.spine-tag{position:absolute;z-index:2;top:0;left:0;background:var(--paper);color:var(--ink);font-size:10px;letter-spacing:.14em;padding:4px 7px;font-weight:600}
.meta-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .no{font-size:10.5px;letter-spacing:.18em;color:var(--accent);font-weight:600;text-transform:uppercase}
.card .title{font-family:var(--serif);font-size:16.5px;line-height:1.2;font-weight:600}
.card .sub{font-size:12px;color:var(--ink-3)}
.score{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1}
.score.s-top{color:var(--good)}.score.s-hi{color:var(--gold)}.score.s-mid{color:var(--warn)}.score.s-low{color:var(--accent)}
.unrated{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);border:1px dashed var(--ink-3);padding:2px 6px}

/* watchlist */
.upnext{margin:18px 0 6px;border:1px solid var(--ink);display:flex;gap:18px;padding:16px;align-items:center;background:var(--card)}
.upnext .lbl{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600}
.upnext .t{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.upnext .cover{width:70px;flex:none}
section.group{padding-top:22px}
section.group h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 6px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:8px}
section.group h2 .n{font-family:var(--sans);font-size:12px;color:var(--ink-3)}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:0 28px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.row .thumb{width:38px;flex:none;aspect-ratio:2/3;position:relative;background:var(--paper-2);overflow:hidden}
.row .thumb img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover}
.row .info{flex:1;min-width:0;cursor:pointer}
.row .t{font-family:var(--serif);font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--rule);padding:1px 5px;color:var(--ink-2);margin-left:4px;vertical-align:2px}
.row select{max-width:118px}
.row .thumb .ph .t,.row .thumb .ph .y{display:none}
.upnext .ph .t{font-size:11px}.upnext .ph .y{display:none}
.season{border:1px solid var(--rule);background:var(--paper);margin-bottom:8px}
.season summary{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;cursor:pointer;font-family:var(--serif);font-size:16px;font-weight:600;list-style:none}
.season summary::-webkit-details-marker{display:none}
.season summary::before{content:"+";font-family:var(--sans);color:var(--ink-3);margin-right:10px;font-weight:400}
.season[open] summary::before{content:"\2212"}
.season summary span:first-child{flex:1}
.season .sv{font-size:20px;font-weight:700}
.season-body{padding:10px 12px 12px;border-top:1px solid var(--rule)}
.season .gut .num{font-size:28px}
.seasons-detail{margin:16px 0}
.seasons-detail h4{font-family:var(--serif);font-size:18px;margin:0 0 6px;font-weight:600}
.sd{padding:6px 0;border-bottom:1px dotted var(--rule)}
.sd .cats{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.sd .snote{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--ink-2);margin-top:3px}
details.det summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
details.det summary::-webkit-details-marker{display:none}
details.det summary h3{margin:0}
details.det summary::after{content:"Show";margin-left:auto;font-size:12px;color:var(--ink-3)}
details.det[open] summary::after{content:"Hide"}
.det-grid{display:grid;grid-template-columns:150px 1fr;gap:20px;margin-top:14px}
.det-poster .cover{width:150px}
@media (max-width:720px){.det-grid{grid-template-columns:1fr}}
.empty{padding:60px 0;text-align:center;color:var(--ink-3);font-family:var(--serif);font-size:18px}

/* dialogs */
dialog{border:none;padding:0;background:var(--paper);color:var(--ink);max-width:min(860px,94vw);width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);border-top:4px solid var(--accent)}
dialog::backdrop{background:rgba(20,15,10,.55);backdrop-filter:blur(2px)}
.dlg{padding:28px;max-height:88vh;overflow:auto}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.dlg-head h2{font-family:var(--serif);font-size:26px;margin:0;font-weight:600}
.x{background:none;border:none;font-size:26px;line-height:1;color:var(--ink-3);padding:0 4px}
.detail{display:grid;grid-template-columns:220px 1fr;gap:28px}
.detail .cover{width:100%}
.detail h2{font-family:var(--serif);font-size:34px;line-height:1.05;margin:4px 0 6px;font-weight:700}
.detail .no{font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:600}
.facts{font-size:13px;color:var(--ink-2);line-height:1.6}
.facts b{color:var(--ink);font-weight:600}
.plot{font-family:var(--serif);font-size:16px;line-height:1.5;margin:14px 0;color:var(--ink-2)}
.bigscore{display:flex;align-items:baseline;gap:12px;margin:14px 0 4px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0}
.bigscore .score{font-size:44px}
.bigscore .anchor{font-family:var(--serif);font-style:italic;color:var(--ink-2);font-size:17px}
.bars{display:grid;gap:7px;margin:14px 0}
.bar{display:grid;grid-template-columns:170px 1fr 52px;gap:10px;align-items:center;font-size:12.5px}
.bar .track{height:6px;background:var(--paper-2);position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.bar .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.standout{color:var(--accent);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.note{white-space:pre-wrap;font-family:var(--serif);font-size:15px;border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:12px 0}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.dlg-foot .left{margin-right:auto}

/* editor */
.form{display:grid;gap:16px}
.f-row{display:grid;grid-template-columns:1fr 110px 130px 150px;gap:12px}
label.f{display:grid;gap:5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.inp{border:1px solid var(--rule);background:var(--card);padding:9px 10px;border-radius:2px;width:100%;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.inp:focus{outline:2px solid var(--ink);outline-offset:-1px}
.title-line{display:flex;gap:8px}
.results{display:grid;gap:4px;max-height:260px;overflow:auto;border:1px solid var(--rule);background:var(--card)}
.result{display:flex;gap:10px;align-items:center;padding:6px 8px;background:none;border:none;text-align:left;border-bottom:1px solid var(--rule)}
.result:hover{background:var(--paper-2)}
.result img,.result .noimg{width:30px;height:45px;object-fit:cover;background:var(--paper-2);flex:none}
.panel{border:1px solid var(--rule);padding:16px;background:var(--card)}
.panel h3{margin:0 0 4px;font-family:var(--serif);font-weight:600;font-size:18px}
.panel .hint{font-size:12px;color:var(--ink-3)}
.gut{display:grid;grid-template-columns:1fr 84px;gap:16px;align-items:center;margin-top:10px}
.gut .num{font-family:var(--serif);font-size:38px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:22px}
.anchors{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-top:2px}
.anchor-now{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-2);margin-top:6px}
.calib{margin-top:12px;font-size:13px;display:grid;gap:3px}
.calib .c{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted var(--rule)}
.calib .c.me{font-weight:600;color:var(--accent);border-bottom-style:solid}
.calib .c span:last-child{font-variant-numeric:tabular-nums}
.cat{display:grid;grid-template-columns:180px 1fr 40px 78px 22px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.cat .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.cat.unset input[type=range]{opacity:.35;filter:grayscale(1)}
.cat.unset .v{color:var(--ink-3)}
.so{border:1px solid var(--rule);background:none;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;color:var(--ink-3)}
.so[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:600}
.clr{background:none;border:none;color:var(--ink-3);font-size:16px;padding:0}
details.more summary{cursor:pointer;font-size:12px;color:var(--ink-2);padding:6px 0;letter-spacing:.06em}
.avgline{font-size:12.5px;color:var(--ink-2);margin-top:8px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}

/* library */
.lib{display:grid;gap:14px}
.lib .panel p{margin:6px 0 12px;font-size:13px;color:var(--ink-2);line-height:1.5}
.lib .acts{display:flex;gap:8px;flex-wrap:wrap}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{border:1px solid var(--rule);padding:10px;background:var(--card)}
.stat b{display:block;font-family:var(--serif);font-size:26px}
.stat span{font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.progress{font-size:12.5px;color:var(--ink-2);margin-top:8px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.viewer-bar{background:var(--paper-2);border-bottom:1px solid var(--rule);font-size:12px;color:var(--ink-2);padding:8px 0}
.viewer-bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hide{display:none!important}

@media (max-width:720px){
  .wrap{padding:0 16px}
  header.mast{padding-top:18px;position:static}
  .brand h1{font-size:32px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:22px 14px}
  .detail{grid-template-columns:1fr}
  .detail .cover{max-width:200px}
  .f-row{grid-template-columns:1fr 1fr}
  .cat{grid-template-columns:1fr 80px 34px 60px 18px}
  .cat input[type=range]{grid-column:1/-1;grid-row:2}
  .bar{grid-template-columns:120px 1fr 44px}
  .rows{grid-template-columns:1fr}
  .statgrid{grid-template-columns:repeat(2,1fr)}
  .dlg{padding:20px}
  .search{max-width:none}
}
</style>
</head>
<body>
<div class="viewer-bar hide" id="viewerBar"><div class="wrap"><span id="viewerInfo">Viewing</span><button class="btn small" id="viewerLoad">Load library</button></div></div>
<header class="mast">
  <div class="wrap">
    <div class="mast-top">
      <div class="brand">
        <h1>Movie <em>Monologue</em></h1>
        <div class="sub" id="subline">A personal catalogue of film &amp; television</div>
      </div>
      <div class="mast-actions">
        <button class="btn nudge hide" id="backupNudge" title="Download a backup of your library"></button>
        <button class="btn ghost" id="openLib">Library</button>
        <button class="btn primary edit-only" id="addBtn">+ Add title</button>
      </div>
    </div>
    <div class="mast-nav">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-view="catalogue" aria-selected="true">Catalogue<span class="n" id="nCat"></span></button>
        <button class="tab" role="tab" data-view="watchlist" aria-selected="false">Watchlist<span class="n" id="nWatch"></span></button>
      </div>
      <input class="search" id="search" type="search" placeholder="Search titles, people, genres" autocomplete="off">
    </div>
  </div>
</header>
<main class="wrap" id="view"></main>

<dialog id="dDetail"><div class="dlg" id="detailBody"></div></dialog>
<dialog id="dEdit"><div class="dlg"><form class="form" id="editForm" autocomplete="off"></form></div></dialog>
<dialog id="dLib"><div class="dlg" id="libBody"></div></dialog>
<input type="file" id="fileIn" accept=".json,application/json" class="hide">
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------------- constants ---------------- */
const OMDB_KEY = "9602b4c4";
const APP_VERSION = "2026-11-14.3"; // bump on every release; triggers a safety snapshot of the library
const STATUSES = ["Watching","Next Watch","Priority","Re-watch","Unwatched","Completed"];
const CATS_FILM = [
  {k:"acting",n:"Acting & Performances"},
  {k:"writing",n:"Writing & Story"},
  {k:"direction",n:"Direction & Vision"},
  {k:"cinematography",n:"Cinematography & Visuals"},
  {k:"sound",n:"Score & Sound Design"},
  {k:"pacing",n:"Pacing & Structure"},
  {k:"impact",n:"Emotional Impact"},
  {k:"ending",n:"Ending & Resolution",more:true},
  {k:"rewatch",n:"Rewatchability",more:true},
];
const CATS_TV = [
  {k:"acting",n:"Acting & Performances"},
  {k:"writing",n:"Writing & Story"},
  {k:"characters",n:"Characters & Development"},
  {k:"direction",n:"Direction & Vision"},
  {k:"cinematography",n:"Cinematography & Visuals"},
  {k:"sound",n:"Score & Sound Design"},
  {k:"pacing",n:"Pacing & Episode Flow"},
  {k:"impact",n:"Emotional Impact"},
  {k:"consistency",n:"Consistency",more:true},
  {k:"ending",n:"Finale & Resolution",more:true},
  {k:"rewatch",n:"Rewatchability",more:true},
];
const catsFor = t => t==="tv" ? CATS_TV : CATS_FILM;
const ALL_CATS = [...CATS_FILM, ...CATS_TV.filter(c=>!CATS_FILM.some(f=>f.k===c.k)).map(c=>({...c,n:c.n+" (series)"}))];
const ALL_KEYS = ALL_CATS.map(c=>c.k);
const ANCHORS = [[10,"All-time favorite"],[9,"Great"],[8,"Very good"],[7,"Good"],[6,"Fine"],[5,"Mediocre"],[4,"Weak"],[0,"Bad"]];

let dbp=null;
function idb(){
  if(!dbp) dbp=new Promise((res,rej)=>{try{const r=indexedDB.open("movie-monologue",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});

}
async function kvGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}

function normalize(e){
  const out={...e,id:e.id||uid(),title:String(e.title||"Untitled").trim(),year:e.year?Number(e.year)||null:null,type:e.type==="tv"?"tv":"movie",
    status:STATUSES.includes(e.status)?e.status:"Unwatched",spine:e.spine||null,overall:typeof e.overall==="number"?e.overall:null,
    scores:{},standout:Array.isArray(e.standout)?[...e.standout]:[],note:e.note||"",poster:e.poster||"",genre:e.genre||"",runtime:e.runtime||"",
    director:e.director||"",actors:e.actors||"",plot:e.plot||"",imdbID:e.imdbID||"",metaFetched:!!e.metaFetched,metaManual:!!e.metaManual,
    addedAt:e.addedAt||Date.now(),ratedAt:e.ratedAt||null};
  out.scores=cleanScores(e.scores,out.standout);
  out.seasons=(Array.isArray(e.seasons)?e.seasons:[]).map(x=>{const st=Array.isArray(x.standout)?[...x.standout]:[];return {n:Math.max(1,parseInt(x.n)||1),overall:typeof x.overall==="number"?x.overall:null,scores:cleanScores(x.scores,st),standout:st,note:x.note||""}}).sort((a,b)=>a.n-b.n);
  out.totalSeasons=parseInt(e.totalSeasons)||null;
  return out;
}
function seedLibrary(){
  const entries=SEED.map(normalize);
  const max=entries.reduce((m,e)=>Math.max(m,e.spine||0),0);
  return {entries,nextSpine:max+1,meta:{lastBackupAt:null,changes:0,source:"starting list",sourceDate:Date.now()}};
}
async function load(){
  try{ lib=await kvGet("library"); }catch(e){ memoryOnly=true; }
  if(!lib||!Array.isArray(lib.entries)){ lib=seedLibrary(); lib.appVersion=APP_VERSION; await persist(false); }
  else if(lib.appVersion!==APP_VERSION && !memoryOnly){
    // First run of a new app version: store an untouched copy of the library before anything reads or rewrites it.
    try{
      const snaps=(await kvGet("snapshots"))||[];
      snaps.unshift({savedAt:Date.now(),fromVersion:lib.appVersion||"original",titles:lib.entries.length,data:structuredClone(lib)});
      await kvSet("snapshots",snaps.slice(0,5));
    }catch(e){ console.warn("snapshot failed",e); }
    lib.appVersion=APP_VERSION;
    lib.entries=lib.entries.map(normalize); lib.meta=lib.meta||{};
    try{ await kvSet("library",lib); }catch{}
  }
  lib.entries=lib.entries.map(normalize);
  lib.meta=lib.meta||{};
  if(CAN_AUTOSAVE && !IS_VIEWER){
    try{ fileHandle=await kvGet("fileHandle"); if(fileHandle){ filePerm=(await fileHandle.queryPermission({mode:"readwrite"}))==="granted"?"granted":"prompt"; } }catch{ fileHandle=null; }
  }
  try{ if(navigator.storage?.persist) navigator.storage.persist(); }catch{}
}
async function persist(countChange=true){
  if(countChange) lib.meta.changes=(lib.meta.changes||0)+1;
  if(!memoryOnly){ try{ await kvSet("library",lib); }catch(e){ memoryOnly=true; toast("Browser storage unavailable. Back up before closing this tab.",5000); } }
  if(fileHandle && filePerm==="granted") scheduleFileWrite();
  renderNudge();
}
function exportPayload(){return JSON.stringify({app:"movie-monologue",version:2,exportedAt:new Date().toISOString(),nextSpine:lib.nextSpine,entries:lib.entries},null,1)}
let fileTimer=null;
function scheduleFileWrite(){clearTimeout(fileTimer);fileTimer=setTimeout(writeFile,600)}
async function writeFile(){
  try{const w=await fileHandle.createWritable();await w.write(exportPayload());await w.close();lib.meta.changes=0;lib.meta.lastBackupAt=Date.now();if(!memoryOnly)await kvSet("library",lib);renderNudge();}
  catch(e){filePerm="prompt";renderNudge();toast("Auto-save paused. Open Library to reconnect the file.",4000)}
}
function downloadBackup(){
  const blob=new Blob([exportPayload()],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="movie-monologue-library.json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  lib.meta.changes=0;lib.meta.lastBackupAt=Date.now();persist(false);toast("Backup downloaded");
}
async function linkFile(){
  try{
    fileHandle=await window.showSaveFilePicker({suggestedName:"movie-monologue-library.json",types:[{description:"Movie Monologue library",accept:{"application/json":[".json"]}}]});
    await kvSet("fileHandle",fileHandle);filePerm="granted";await writeFile();toast("Auto-saving to "+fileHandle.name);renderLib();
  }catch(e){ if(e?.name!=="AbortError") toast("Couldn't link that file"); }
}
async function reconnectFile(){
  try{ const p=await fileHandle.requestPermission({mode:"readwrite"}); filePerm=p==="granted"?"granted":"prompt"; if(filePerm==="granted"){await writeFile();toast("Auto-save reconnected")} renderLib(); }catch{ toast("Couldn't reconnect"); }
}
async function unlinkFile(){fileHandle=null;filePerm="none";try{await kvSet("fileHandle",null)}catch{};renderLib();renderNudge()}
function importFile(file){
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      const entries=Array.isArray(d)?d:d.entries;
      if(!Array.isArray(entries)) throw new Error("bad");
      if(!IS_VIEWER && !confirm(`Replace your current library (${lib.entries.length} titles) with this backup (${entries.length} titles)?`)) return;
      const es=entries.map(normalize);
      lib={entries:es,nextSpine:Math.max(d.nextSpine||0,es.reduce((m,e)=>Math.max(m,e.spine||0),0)+1),
           meta:{lastBackupAt:Date.now(),changes:0,source:file.name,sourceDate:d.exportedAt?Date.parse(d.exportedAt):file.lastModified}};
      await persist(false);render();renderLib();toast(`Loaded ${es.length} titles`);
    }catch(e){toast("That file isn't a Movie Monologue backup")}
  };
  r.readAsText(file);
}

/* ---------------- OMDb ---------------- */
async function omdb(params){
  const u=new URL("https://www.omdbapi.com/");u.searchParams.set("apikey",OMDB_KEY);
  for(const [k,v] of Object.entries(params)) if(v!=null&&v!=="") u.searchParams.set(k,v);
  const r=await fetch(u);const j=await r.json();return j.Response==="True"?j:null;
}
function applyMeta(e,m,force=false){
  // force = the user picked this exact IMDb title: overwrite everything, including type and year
  if(!m) return;
  const f=x=>x&&x!=="N/A"?x:"";
  const set=(k,v)=>{ if(v||force) e[k]=v; };
  const isTv=m.Type==="series";
  set("poster",f(m.Poster)); set("genre",f(m.Genre)); set("runtime",f(m.Runtime));
  set("director",f(m.Director)||(isTv?f(m.Writer):""));
  set("actors",f(m.Actors)); set("plot",f(m.Plot));
  e.imdbID=m.imdbID||e.imdbID;
  const y=parseInt(m.Year); if(y&&(force||!e.year)) e.year=y;
  if(force){ e.type=isTv?"tv":"movie"; e.metaManual=false; }
  const ts=parseInt(m.totalSeasons); if(ts) e.totalSeasons=ts; else if(force) e.totalSeasons=null;
  e.metaFetched=true;
}
async function fetchMetaFor(e){
  const type=e.type==="tv"?"series":"movie";
  let m=null;
  if(e.imdbID) m=await omdb({i:e.imdbID,plot:"short"});
  if(!m) m=await omdb({t:e.title.replace(/\s*\(Ken Burns\)/,""),y:e.year,type,plot:"short"});
  if(!m) m=await omdb({t:e.title,type,plot:"short"});
  if(m) applyMeta(e,m); else e.metaFetched=true;
  return !!m;
}
let bulkRunning=false;
async function fetchAllMissing(){
  if(bulkRunning) return; bulkRunning=true;
  const todo=lib.entries.filter(e=>!e.metaFetched);
  let done=0,found=0;
  const prog=()=>{const p=$("#libProgress");if(p)p.textContent=`Fetching details: ${done} of ${todo.length} (${found} found)`};
  prog();
  for(const e of todo){
    try{ if(await fetchMetaFor(e)) found++; }catch{ /* network hiccup: leave for next run */ e.metaFetched=false; }
    done++; prog();
    if(done%10===0){ await persist(false); render(); }
  }
  await persist(true); bulkRunning=false; render(); renderLib();
  toast(`Details fetched for ${found} of ${todo.length}`);
}

function renderCatalogue(all){
  const genres=[...new Set(all.flatMap(e=>e.genre?e.genre.split(",").map(s=>s.trim()):[]))].sort();
  let list=all.filter(e=>matchesQ(e)&&(ui.type==="all"||e.type===ui.type)&&(!ui.genre||e.genre.includes(ui.genre))&&(!ui.unrated||e.overall==null));
  const s=ui.sort;
  const by={
    spine:(a,b)=>a.spine-b.spine, spineDesc:(a,b)=>b.spine-a.spine,
    score:(a,b)=>(b.overall??-1)-(a.overall??-1)||a.spine-b.spine,
    title:(a,b)=>a.title.replace(/^(the|a|an)\s+/i,"").localeCompare(b.title.replace(/^(the|a|an)\s+/i,"")),
    year:(a,b)=>(b.year||0)-(a.year||0),
  };
  if(by[s]) list.sort(by[s]);
  else { list=list.filter(e=>typeof e.scores[s]==="number"); list.sort((a,b)=>b.scores[s]-a.scores[s]||(b.overall??0)-(a.overall??0)); }
  const unratedN=all.filter(e=>e.overall==null).length;
  $("#view").innerHTML=`
  <div class="toolbar">
    <div class="chips">
      ${[["all","All"],["movie","Films"],["tv","Series"]].map(([k,n])=>`<button class="chip" data-type="${k}" aria-pressed="${ui.type===k}">${n}</button>`).join("")}
      ${unratedN?`<button class="chip" id="chipUnrated" aria-pressed="${ui.unrated}">Unrated (${unratedN})</button>`:""}
    </div>
    <select class="sel" id="genreSel"><option value="">All genres</option>${genres.map(g=>`<option ${ui.genre===g?"selected":""}>${esc(g)}</option>`).join("")}</select>
    <span class="spacer"></span>
    <span class="count">${list.length} shown</span>
    <select class="sel" id="sortSel">
      <option value="spine">Spine number</option><option value="spineDesc">Newest first</option><option value="score">Score</option><option value="title">Title</option><option value="year">Release year</option>
      <optgroup label="Best by category">${ALL_CATS.map(c=>`<option value="${c.k}">${esc(c.n)}</option>`).join("")}</optgroup>
    </select>
  </div>
  ${list.length?`<div class="grid">${list.map(e=>`
    <button class="card" data-id="${e.id}">
      ${coverHTML(e,false)}
      <div class="meta-row"><span class="no">${spineStr(e.spine)}</span>${(v=>v!=null?`<span class="score ${scoreClass(v)}">${fmt(v)}</span>`:`<span class="unrated">Unrated</span>`)(by[s]?e.overall:e.scores[s])}</div>
      <div class="title">${esc(e.title)}</div>
      <div class="sub">${esc(e.year||"")}${e.type==="tv"?" · Series"+(e.seasons.some(x=>x.overall!=null)?` · ${e.seasons.filter(x=>x.overall!=null).length} season${e.seasons.filter(x=>x.overall!=null).length===1?"":"s"} rated`:""):""}${e.director?" · "+esc(e.director.split(",")[0]):""}</div>
    </button>`).join("")}</div>`:`<div class="empty">${all.length?"Nothing matches.":"Nothing catalogued yet."}</div>`}`;
  $("#sortSel").value=s;
  $$("[data-type]").forEach(b=>b.onclick=()=>{ui.type=b.dataset.type;render()});
  $("#chipUnrated")&&($("#chipUnrated").onclick=()=>{ui.unrated=!ui.unrated;render()});
  $("#genreSel").onchange=ev=>{ui.genre=ev.target.value;render()};
  $("#sortSel").onchange=ev=>{ui.sort=ev.target.value;lsSet("mm-sort",ui.sort);render()};
  $$(".card").forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
}
function renderWatchlist(all){
  const list=all.filter(e=>matchesQ(e)&&(ui.wtype==="all"||e.type===ui.wtype));
  const next=list.filter(e=>e.status==="Next Watch");
  const groups=["Watching","Priority","Re-watch","Unwatched"].map(st=>[st,list.filter(e=>e.status===st).sort((a,b)=>a.title.replace(/^(the|a|an)\s+/i,"").localeCompare(b.title.replace(/^(the|a|an)\s+/i,"")))]);
  const row=e=>`
    <div class="row" data-id="${e.id}">
      <div class="thumb">${coverHTML(e).replace('class="cover"','class="cover" style="aspect-ratio:auto;height:100%;box-shadow:none"')}</div>
      <div class="info" data-open="${e.id}"><div class="t">${esc(e.title)}${e.type==="tv"?'<span class="tag">Series</span>':""}</div>
        <div class="s">${[e.year,e.runtime,e.genre].filter(Boolean).map(esc).join(" · ")||"&nbsp;"}</div></div>
      ${IS_VIEWER?"":`<select class="sel" data-status="${e.id}">${STATUSES.map(s=>`<option ${s===e.status?"selected":""}>${s}</option>`).join("")}</select>`}
    </div>`;
  $("#view").innerHTML=`
  <div class="toolbar">
    <div class="chips">${[["all","All"],["movie","Films"],["tv","Series"]].map(([k,n])=>`<button class="chip" data-wtype="${k}" aria-pressed="${ui.wtype===k}">${n}</button>`).join("")}</div>
    <span class="spacer"></span><span class="count">${list.length} titles</span>
  </div>
  ${next.map(e=>`<div class="upnext">${coverHTML(e)}<div style="flex:1;min-width:0"><div class="lbl">Up next</div><div class="t">${esc(e.title)}</div>
     <div class="count">${[e.year,e.runtime,e.genre].filter(Boolean).map(esc).join(" · ")}</div></div>
     ${IS_VIEWER?"":`<button class="btn primary small" data-watched="${e.id}">Watched it</button>`}</div>`).join("")}
  ${groups.filter(([,g])=>g.length).map(([st,g])=>`<section class="group"><h2>${st}<span class="n">${g.length}</span></h2><div class="rows">${g.map(row).join("")}</div></section>`).join("")}
  ${list.length?"":`<div class="empty">${all.length?"Nothing matches.":"Watchlist is empty."}</div>`}
  <div style="height:80px"></div>`;
  $$("[data-wtype]").forEach(b=>b.onclick=()=>{ui.wtype=b.dataset.wtype;render()});
  $$("[data-open]").forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
  $$("[data-watched]").forEach(b=>b.onclick=()=>markWatched(b.dataset.watched));
  $$("[data-status]").forEach(s=>s.onchange=()=>{
    const e=byId(s.dataset.status);
    if(s.value==="Completed"){ s.value=e.status; markWatched(e.id); return; }
    e.status=s.value;persist();render();toast(`${e.title}: ${e.status}`);
  });
}
const byId=id=>lib.entries.find(e=>e.id===id);
function markWatched(id){const e=byId(id);openEditor(e,{status:"Completed"})}

/* ---------------- detail ---------------- */
function openDetail(id){
  const e=byId(id); if(!e) return;
  const bars=catsFor(e.type).filter(c=>typeof e.scores[c.k]==="number");
  const seas=e.type==="tv"?e.seasons:[], sAvg=seasonAvg(e);
  const avg=catAvg(e);
  $("#detailBody").innerHTML=`
  <div class="dlg-head"><span></span><button class="x" data-close aria-label="Close">&times;</button></div>
  <div class="detail">
    <div>${coverHTML(e)}</div>
    <div>
      <div class="no">${e.spine?spineStr(e.spine):esc(e.status)}${e.spine&&e.status!=="Completed"?" · "+esc(e.status):""}</div>
      <h2>${esc(e.title)}</h2>
      <div class="facts">${[e.year,typeLabel(e.type),e.runtime,e.genre].filter(Boolean).map(esc).join(" · ")}</div>
      ${e.director?`<div class="facts"><b>${e.type==="tv"?"Created by":"Directed by"}</b> ${esc(e.director)}</div>`:""}
      ${e.actors?`<div class="facts"><b>Starring</b> ${esc(e.actors)}</div>`:""}
      ${e.plot?`<p class="plot">${esc(e.plot)}</p>`:""}
      ${e.spine?(e.overall!=null?`<div class="bigscore"><span class="score ${scoreClass(e.overall)}">${fmt(e.overall)}</span><span class="anchor">${anchorFor(e.overall)}</span></div>`
                     :`<div class="bigscore"><span class="unrated">Not yet rated</span></div>`):""}
      ${bars.length?`<div class="bars">${bars.map(c=>`<div class="bar"><span>${esc(c.n)}${e.standout.includes(c.k)?' <span class="standout">Standout</span>':""}</span><div class="track"><div class="fill" style="width:${e.scores[c.k]*10}%"></div></div><span class="v">${fmt(e.scores[c.k])}</span></div>`).join("")}</div>
        <div class="avgline">Breakdown average ${fmt(avg)}${e.overall!=null?` · your score ${fmt(e.overall)} (${e.overall-avg>=0?"+":""}${fmt(e.overall-avg)})`:""}</div>`:""}
      ${seas.length?`<div class="seasons-detail"><h4>Seasons${e.totalSeasons?` <span class="count">${seas.length} of ${e.totalSeasons} logged</span>`:""}</h4>${seas.map(x=>`<div class="sd">
        <div class="bar"><span>Season ${x.n}</span><div class="track">${x.overall!=null?`<div class="fill" style="width:${x.overall*10}%"></div>`:""}</div><span class="v">${x.overall!=null?fmt(x.overall):"&mdash;"}</span></div>
        ${Object.keys(x.scores).length?`<div class="cats">${catsFor("tv").filter(c=>typeof x.scores[c.k]==="number").map(c=>`${esc(c.n)} ${fmt(x.scores[c.k])}${x.standout.includes(c.k)?" (standout)":""}`).join(" · ")}</div>`:""}
        ${x.note?`<div class="snote">${esc(x.note)}</div>`:""}</div>`).join("")}
        ${sAvg!=null?`<div class="avgline">Season average ${fmt(sAvg)}</div>`:""}</div>`:""}
      ${e.note?`<div class="note">${esc(e.note)}</div>`:""}
      ${e.imdbID?`<div class="facts" style="margin-top:10px"><a href="https://www.imdb.com/title/${esc(e.imdbID)}/" target="_blank" rel="noopener">IMDb</a> · <a href="https://letterboxd.com/imdb/${esc(e.imdbID)}/" target="_blank" rel="noopener">Letterboxd</a></div>`:""}
    </div>
  </div>
  <div class="dlg-foot edit-only">
    <button class="btn danger small left" id="delBtn">Delete</button>
    ${e.status!=="Completed"?`<button class="btn small" id="watchedBtn">Watched it</button>`:""}
    <button class="btn primary small" id="editBtn">${e.spine&&e.overall==null?"Rate":"Edit"}</button>
  </div>`;
  const d=$("#dDetail"); d.showModal();
  $("[data-close]",d).onclick=()=>d.close();
  if(!IS_VIEWER){
    $("#editBtn").onclick=()=>{d.close();openEditor(e)};
    $("#watchedBtn")&&($("#watchedBtn").onclick=()=>{d.close();markWatched(e.id)});
    $("#delBtn").onclick=async()=>{ if(!confirm(`Delete "${e.title}"?${e.spine?" Its spine number will be retired.":""}`))return; lib.entries=lib.entries.filter(x=>x.id!==e.id); await persist(); d.close(); render(); toast("Deleted"); };
  }
}

/* ---------------- editor ---------------- */
let draft=null, draftIsNew=false;
function openEditor(e,override={}){
  draftIsNew=!e;
  draft=e?structuredClone(e):normalize({title:"",status:"Unwatched"});
  if(draftIsNew) draft.title="";
  Object.assign(draft,override);
  if(override.status==="Completed" && draft.overall==null) draft._rateNow=true;
  openSeasons.clear(); detOpen=null;
  renderEditor(); $("#dEdit").showModal();
  if(draft.type==="tv"&&!draft.totalSeasons&&draft.imdbID){ const id=draft.id; omdb({i:draft.imdbID}).then(m=>{const n=parseInt(m?.totalSeasons);if(!n)return;const e=byId(id);if(e){e.totalSeasons=n;persist(false)}if(draft.id===id&&$("#dEdit").open){draft.totalSeasons=n;syncDraft();renderEditor()}}).catch(()=>{}); }
  if(draftIsNew) setTimeout(()=>$("#fTitle").focus(),50);
}
const openSeasons=new Set(); let detOpen=null;
const scopeObj=sc=>sc==="main"?draft:draft.seasons[+sc];
const nextSeasonN=()=>draft.seasons.reduce((m,x)=>Math.max(m,x.n),0)+1;
function catRowHTML(c,obj,scope){const v=obj.scores[c.k],set=typeof v==="number";return `
    <div class="cat ${set?"":"unset"}" data-cat="${c.k}" data-scope="${scope}">
      <span>${esc(c.n)}</span>
      <input type="range" min="0" max="10" step="0.5" value="${set?v:5}" aria-label="${esc(c.n)}">
      <span class="v">${set?fmt(v):"&mdash;"}</span>
      <button type="button" class="so" aria-pressed="${obj.standout.includes(c.k)}" title="Mark as a standout">Standout</button>
      <button type="button" class="clr" title="Clear" aria-label="Clear">&times;</button>
    </div>`}
function catsBlock(obj,scope,type){
  const cats=catsFor(type), anyMore=cats.some(c=>c.more&&typeof obj.scores[c.k]==="number");
  return `<div>${cats.filter(c=>!c.more).map(c=>catRowHTML(c,obj,scope)).join("")}</div>
    <details class="more" ${anyMore?"open":""}><summary>More categories</summary>${cats.filter(c=>c.more).map(c=>catRowHTML(c,obj,scope)).join("")}</details>`;
}
function seasonHTML(x,i){
  const has=x.overall!=null, g=has?x.overall:7;
  return `<details class="season" data-si="${i}" ${openSeasons.has(x.n)?"open":""}>
    <summary><span>Season ${x.n}</span><span class="sv ${has?scoreClass(x.overall):""}">${has?fmt(x.overall):"&mdash;"}</span></summary>
    <div class="season-body">
      <label class="check"><input type="checkbox" class="sNo" ${has?"":"checked"}> Not rated yet</label>
      <div class="sGutWrap ${has?"":"hide"}">
        <div class="gut"><input type="range" class="sGut" min="0" max="10" step="0.1" value="${g}" aria-label="Season ${x.n} score"><div class="num sNum">${fmt(g)}</div></div>
        <div class="anchor-now sAnchor">${anchorFor(g)}</div>
      </div>
      <div class="hint" style="margin:14px 0 4px">Breakdown for this season (optional)</div>
      ${catsBlock(x,String(i),"tv")}
      <div class="avgline sAvg"></div>
      <textarea class="inp sNote" rows="2" placeholder="Notes on this season" style="margin-top:10px">${esc(x.note)}</textarea>
      <div style="text-align:right;margin-top:8px"><button type="button" class="btn small danger sDel">Remove season ${x.n}</button></div>
    </div></details>`;
}
function renderEditor(){
  const d=draft, rated=d.status==="Completed"||!!d.spine, tv=d.type==="tv";
  const hasScore=d.overall!=null;
  const gutVal=hasScore?d.overall:7.0;
  $("#editForm").innerHTML=`
  <div class="dlg-head"><h2>${draftIsNew?"Add a title":esc(d.title)}</h2><button type="button" class="x" data-close aria-label="Close">&times;</button></div>
  <div class="f-row">
    <label class="f">Title<div class="title-line"><input class="inp" id="fTitle" value="${esc(d.title)}" required><button type="button" class="btn small" id="lookup">Look up</button></div></label>
    <label class="f">Year<input class="inp" id="fYear" inputmode="numeric" value="${esc(d.year||"")}"></label>
    <label class="f">Type<select class="inp" id="fType"><option value="movie">Film</option><option value="tv">Series</option></select></label>
    <label class="f">Status<select class="inp" id="fStatus">${STATUSES.map(x=>`<option>${x}</option>`).join("")}</select></label>
  </div>
  <div id="results" class="results hide"></div>
  ${rated?`
  <div class="panel">
    <h3>${tv?"Series score":"Your score"}</h3>
    <div class="hint">Your overall verdict, set directly. It's compared only with your other ${tv?"series":"films"}.</div>
    <label class="check" style="margin-top:10px"><input type="checkbox" id="fNoScore" ${hasScore?"":"checked"}> Not rated yet</label>
    <div id="gutWrap" class="${hasScore?"":"hide"}">
      <div class="gut"><input type="range" id="fGut" min="0" max="10" step="0.1" value="${gutVal}"><div class="num" id="gutNum">${fmt(gutVal)}</div></div>
      <div class="anchors"><span>0</span><span>5 Mediocre</span><span>6 Fine</span><span>7 Good</span><span>8 Very good</span><span>9 Great</span><span>10</span></div>
      <div class="anchor-now" id="anchorNow">${anchorFor(gutVal)}</div>
      <div class="calib" id="calib"></div>
    </div>
    ${tv?`<div class="avgline" id="seasonAvgLine"></div>`:""}
  </div>`:""}
  ${tv?`
  <div class="panel">
    <h3>Seasons <span class="hint" style="font-family:var(--sans)">optional</span></h3>
    <div class="hint">Score each season on its own, with its own breakdown if you want one.${d.totalSeasons?` This show has ${d.totalSeasons} season${d.totalSeasons===1?"":"s"}.`:""}</div>
    <div style="margin-top:10px">${d.seasons.map(seasonHTML).join("")}</div>
    <button type="button" class="btn small" id="addSeason" style="margin-top:4px">+ Add season ${nextSeasonN()}</button>
  </div>`:""}
  ${rated?`
  <div class="panel">
    <h3>${tv?"Whole-series breakdown":"Breakdown"} <span class="hint" style="font-family:var(--sans)">optional</span></h3>
    <div class="hint">Rate whichever categories you have an opinion on. They don't change your score; they power sorting and the check below.</div>
    <div style="margin-top:10px">${catsBlock(d,"main",d.type)}</div>
    <div class="avgline" id="avgLine"></div>
  </div>`:""}
  <details class="panel det" id="detPanel" ${(detOpen??(!d.poster||!d.imdbID))?"open":""}>
    <summary><h3>Details</h3><span class="hint">Poster, cast and plot. Pulled from IMDb, and every field can be edited.</span></summary>
    <div class="det-grid">
      <div class="det-poster" id="detPoster">${coverHTML(d)}</div>
      <div class="form" style="gap:12px">
        <label class="f">IMDb link<div class="title-line"><input class="inp" id="fImdb" placeholder="Paste an IMDb link or ID (tt1234567)" value="${d.imdbID?`https://www.imdb.com/title/${esc(d.imdbID)}/`:""}"><button type="button" class="btn small" id="fetchImdb">Fetch</button></div>
          <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">Wrong match? Paste the right IMDb page and click Fetch. It replaces the poster, details, year and film/series type.</span></label>
        <label class="f">Poster image URL<input class="inp" data-meta="poster" value="${esc(d.poster)}" placeholder="Right-click any poster online, Copy Image Address, paste here"></label>
        <div class="f-row" style="grid-template-columns:1fr 140px"><label class="f">Genre<input class="inp" data-meta="genre" value="${esc(d.genre)}"></label><label class="f">Runtime<input class="inp" data-meta="runtime" value="${esc(d.runtime)}"></label></div>
        <label class="f">${tv?"Created by":"Directed by"}<input class="inp" data-meta="director" value="${esc(d.director)}"></label>
        <label class="f">Starring<input class="inp" data-meta="actors" value="${esc(d.actors)}"></label>
        <label class="f">Plot<textarea class="inp" data-meta="plot" rows="3">${esc(d.plot)}</textarea></label>
      </div>
    </div>
  </details>
  <label class="f">Notes<textarea class="inp" id="fNote" rows="3">${esc(d.note)}</textarea></label>
  <div class="dlg-foot"><button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn primary">${draftIsNew?"Add":"Save"}</button></div>`;
  const f=$("#editForm");
  $("#fType").value=d.type; $("#fStatus").value=d.status;
  $$("[data-close]",f).forEach(b=>b.onclick=()=>$("#dEdit").close());
  $("#fStatus").onchange=()=>{syncDraft();renderEditor()};
  $("#fType").onchange=()=>{syncDraft();renderEditor()};
  $("#lookup").onclick=doLookup;
  $("#fTitle").onkeydown=ev=>{if(ev.key==="Enter"&&draftIsNew){ev.preventDefault();doLookup()}};
  if(rated){
    const gut=$("#fGut");
    gut.oninput=()=>{draft.overall=Number(gut.value);$("#gutNum").textContent=fmt(gut.value);$("#anchorNow").textContent=anchorFor(Number(gut.value));renderCalib();renderAvg()};
    $("#fNoScore").onchange=ev=>{draft.overall=ev.target.checked?null:Number(gut.value);$("#gutWrap").classList.toggle("hide",ev.target.checked);renderCalib();renderAvg()};
    if(d._rateNow){ $("#fNoScore").checked=false; $("#gutWrap").classList.remove("hide"); draft.overall=Number(gut.value); delete d._rateNow; }
  }
  $$(".cat",f).forEach(row=>{
    const k=row.dataset.cat, sc=row.dataset.scope, r=$("input",row);
    const after=()=>sc==="main"?renderAvg():renderSeasonMeta(+sc);
    r.oninput=()=>{const o=scopeObj(sc);o.scores[k]=Number(r.value);row.classList.remove("unset");$(".v",row).textContent=fmt(r.value);after()};
    $(".clr",row).onclick=()=>{const o=scopeObj(sc);delete o.scores[k];o.standout=o.standout.filter(x=>x!==k);row.classList.add("unset");$(".v",row).innerHTML="&mdash;";$(".so",row).setAttribute("aria-pressed","false");after()};
    $(".so",row).onclick=ev=>{const o=scopeObj(sc);const on=!o.standout.includes(k);o.standout=on?[...o.standout,k]:o.standout.filter(x=>x!==k);ev.target.setAttribute("aria-pressed",on)};
  });
  if(tv){
    $("#addSeason").onclick=()=>{syncDraft();const n=nextSeasonN();draft.seasons.push({n,overall:null,scores:{},standout:[],note:""});openSeasons.add(n);renderEditor()};
    $$(".season",f).forEach(el=>{
      const i=+el.dataset.si, x=draft.seasons[i], g=$(".sGut",el);
      el.addEventListener("toggle",()=>{el.open?openSeasons.add(x.n):openSeasons.delete(x.n)});
      g.oninput=()=>{x.overall=Number(g.value);$(".sNum",el).textContent=fmt(g.value);$(".sAnchor",el).textContent=anchorFor(x.overall);renderSeasonMeta(i)};
      $(".sNo",el).onchange=ev=>{x.overall=ev.target.checked?null:Number(g.value);$(".sGutWrap",el).classList.toggle("hide",ev.target.checked);renderSeasonMeta(i)};
      $(".sNote",el).oninput=ev=>{x.note=ev.target.value};
      $(".sDel",el).onclick=()=>{if(!confirm(`Remove Season ${x.n} and its scores?`))return;syncDraft();draft.seasons.splice(i,1);openSeasons.delete(x.n);renderEditor()};
      renderSeasonMeta(i);
    });
  }
  $("#detPanel").addEventListener("toggle",ev=>{detOpen=ev.target.open});
  $$("[data-meta]",f).forEach(i=>i.oninput=()=>{draft[i.dataset.meta]=i.value.trim();draft.metaManual=true;draft.metaFetched=true;if(i.dataset.meta==="poster")$("#detPoster").innerHTML=coverHTML(draft)});
  $("#fImdb").onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();$("#fetchImdb").click()}};
  $("#fetchImdb").onclick=async()=>{
    const id=($("#fImdb").value.match(/tt\d{6,10}/)||[])[0];
    if(!id){toast("That doesn't look like an IMDb link. It should contain an ID like tt1234567");return}
    const btn=$("#fetchImdb"); btn.disabled=true; btn.textContent="Fetching...";
    try{
      const m=await omdb({i:id,plot:"short"});
      if(!m){toast("IMDb ID not found");return}
      syncDraft(); applyMeta(draft,m,true); detOpen=true; renderEditor();
      toast(`Details from IMDb: ${m.Title} (${m.Year}, ${m.Type==="series"?"series":"film"})`);
    }catch{toast("Couldn't reach OMDb (offline?)")}
    finally{ if(document.body.contains(btn)){btn.disabled=false;btn.textContent="Fetch"} }
  };
  renderCalib();renderAvg();renderSeasonAvg();
}
function renderSeasonMeta(i){
  const el=$(`.season[data-si="${i}"]`); if(!el) return; const x=draft.seasons[i];
  const sv=$(".sv",el); sv.className="sv "+(x.overall!=null?scoreClass(x.overall):""); sv.innerHTML=x.overall!=null?fmt(x.overall):"&mdash;";
  const a=catAvgCats(x,"tv"), n=catsFor("tv").filter(c=>typeof x.scores[c.k]==="number").length;
  $(".sAvg",el).textContent=a==null?"":`Breakdown average ${fmt(a)} across ${n} ${n===1?"category":"categories"}`+(x.overall!=null?` · season score is ${x.overall-a>=0?"+":""}${fmt(x.overall-a)} from it`:"");
  renderSeasonAvg();
}
function renderSeasonAvg(){
  const el=$("#seasonAvgLine"); if(!el) return;
  const a=seasonAvg(draft);
  if(a==null){el.innerHTML="";return}
  el.innerHTML=`Season average ${fmt(a)} <button type="button" class="btn small ghost" id="useSeasonAvg">Use as series score</button>`;
  $("#useSeasonAvg").onclick=()=>{const v=Math.round(a*10)/10,g=$("#fGut");g.value=v;$("#fNoScore").checked=false;$("#gutWrap").classList.remove("hide");g.oninput()};
}
function renderCalib(){
  const el=$("#calib"); if(!el) return;
  if(draft.overall==null){el.innerHTML="";return}
  const others=lib.entries.filter(e=>e.id!==draft.id&&e.overall!=null&&e.type===draft.type).sort((a,b)=>b.overall-a.overall);
  if(!others.length){el.innerHTML="";return}
  const v=draft.overall;
  const above=others.filter(e=>e.overall>=v).slice(-2), below=others.filter(e=>e.overall<v).slice(0,2);
  const line=(e)=>`<div class="c"><span>${esc(e.title)}</span><span>${fmt(e.overall)}</span></div>`;
  el.innerHTML=above.map(line).join("")+`<div class="c me"><span>${esc($("#fTitle").value||"This title")}</span><span>${fmt(v)}</span></div>`+below.map(line).join("");
}
function renderAvg(){
  const el=$("#avgLine"); if(!el) return;
  const a=catAvg(draft);
  if(a==null){el.textContent="";return}
  const n=catsFor(draft.type).filter(c=>typeof draft.scores[c.k]==="number").length;
  el.textContent=`Breakdown average ${fmt(a)} across ${n} ${n===1?"category":"categories"}`+(draft.overall!=null?` · your score is ${draft.overall-a>=0?"+":""}${fmt(draft.overall-a)} from it`:"");
}
function syncDraft(){
  draft.title=$("#fTitle").value.trim();draft.year=parseInt($("#fYear").value)||null;draft.type=$("#fType").value;draft.status=$("#fStatus").value;draft.note=$("#fNote").value;
}
async function doLookup(){
  syncDraft(); const q=draft.title; if(!q){$("#fTitle").focus();return}
  const box=$("#results"); box.classList.remove("hide"); box.innerHTML=`<div class="result">Searching&hellip;</div>`;
  try{
    const r=await omdb({s:q,y:draft.year||""}) || await omdb({s:q});
    const items=(r?.Search||[]).filter(x=>x.Type==="movie"||x.Type==="series").slice(0,10);
    if(!items.length){box.innerHTML=`<div class="result">No matches. You can still save it as typed.</div>`;return}
    box.innerHTML=items.map((x,i)=>`<button type="button" class="result" data-i="${i}">${x.Poster&&x.Poster!=="N/A"?`<img src="${esc(x.Poster)}" alt="" referrerpolicy="no-referrer">`:`<span class="noimg"></span>`}<span><b>${esc(x.Title)}</b><br><span class="count">${esc(x.Year)} · ${x.Type==="series"?"Series":"Film"}</span></span></button>`).join("");
    $$(".result",box).forEach(b=>b.onclick=async()=>{
      const x=items[+b.dataset.i]; box.innerHTML=`<div class="result">Loading details&hellip;</div>`;
      const m=await omdb({i:x.imdbID,plot:"short"});
      syncDraft(); draft.title=x.Title; draft.year=parseInt(x.Year)||null; draft.type=x.Type==="series"?"tv":"movie"; applyMeta(draft,m,true);
      renderEditor(); toast("Details filled in");
    });
  }catch{box.innerHTML=`<div class="result">Lookup failed (offline?). You can still save it as typed.</div>`}
}
$("#editForm").addEventListener("submit",async ev=>{
  ev.preventDefault(); syncDraft();
  if(!draft.title){$("#fTitle").focus();return}
  if(draftIsNew){
    const dup=lib.entries.find(e=>e.title.toLowerCase()===draft.title.toLowerCase()&&(!draft.year||!e.year||e.year===draft.year));
    if(dup&&!confirm(`"${dup.title}" is already in your library (${dup.status}). Add anyway?`)) return;
  }
  const prev=byId(draft.id);
  if(draft.status==="Completed"&&!draft.spine){ draft.spine=lib.nextSpine++; }
  if(draft.overall!=null&&(!prev||prev.overall!==draft.overall)) draft.ratedAt=Date.now();
  delete draft._rateNow;
  const clean=normalize(draft);
  if(prev) Object.assign(prev,clean); else lib.entries.push(clean);
  await persist(); $("#dEdit").close();
  if(clean.status==="Completed"&&ui.view!=="catalogue"&&!prev?.spine){toast(`${clean.title} catalogued as ${spineStr(clean.spine)}`)} else toast(draftIsNew?"Added":"Saved");
  render();
  if(!clean.metaFetched){ fetchMetaFor(clean).then(ok=>{ if(ok){persist(false);render()} }).catch(()=>{}); }
});

/* ---------------- library dialog ---------------- */
function renderNudge(){
  const b=$("#backupNudge"); if(IS_VIEWER){b.classList.add("hide");return}
  const auto=fileHandle&&filePerm==="granted";
  const ch=lib.meta.changes||0;
  if(auto){b.classList.add("hide");return}
  if(fileHandle&&filePerm==="prompt"){b.textContent="Reconnect auto-save";b.classList.remove("hide");b.onclick=reconnectFile;return}
  const stale=!lib.meta.lastBackupAt||(Date.now()-lib.meta.lastBackupAt)>7*864e5;
  if(ch>0&&(ch>=5||stale)){b.textContent=`Back up (${ch} change${ch===1?"":"s"})`;b.classList.remove("hide");b.onclick=downloadBackup}
  else b.classList.add("hide");
}
function renderLib(){
  const body=$("#libBody"); if(!body||!lib) return;
  const es=lib.entries, done=es.filter(e=>e.spine), rated=done.filter(e=>e.overall!=null);
  const avg=rated.length?rated.reduce((a,e)=>a+e.overall,0)/rated.length:null;
  const missing=es.filter(e=>!e.metaFetched).length;
  const theme=document.documentElement.dataset.theme;
  body.innerHTML=`
  <div class="dlg-head"><h2>Library</h2><button class="x" data-close aria-label="Close">&times;</button></div>
  <div class="lib">
    <div class="statgrid">
      <div class="stat"><b>${done.length}</b><span>Catalogued</span></div>
      <div class="stat"><b>${rated.length}</b><span>Rated</span></div>
      <div class="stat"><b>${es.length-done.length}</b><span>Watchlist</span></div>
      <div class="stat"><b>${avg!=null?fmt(avg):"&mdash;"}</b><span>Avg score</span></div>
    </div>
    ${IS_VIEWER?`
    <div class="panel"><h3>View your library</h3>
      <p>This phone is in viewer mode. Load the latest backup file from your Mac (for example from iCloud Drive in the Files app) to see your current catalogue.</p>
      <div class="acts"><button class="btn primary" data-act="import">Load library file</button></div></div>`:`
    <div class="panel"><h3>Backups</h3>
      <p>Your library lives in this browser on this computer. ${memoryOnly?"<b>Storage is unavailable right now (private window?). Download a backup before closing.</b> ":""}Last backup: <b>${ago(lib.meta.lastBackupAt)}</b>${lib.meta.changes?` · ${lib.meta.changes} change${lib.meta.changes===1?"":"s"} since`:""}.
      Save backups to iCloud Drive so your phone can open them.</p>
      <div class="acts"><button class="btn primary" data-act="backup">Download backup</button><button class="btn" data-act="import">Restore from backup&hellip;</button></div>
      ${CAN_AUTOSAVE?`<p style="margin-top:14px"><b>Auto-save:</b> ${fileHandle?(filePerm==="granted"?`saving every change to <b>${esc(fileHandle.name)}</b>.`:`linked to <b>${esc(fileHandle.name)}</b>, waiting for permission.`):"off. This browser can save every change straight to a file."}</p>
      <div class="acts">${fileHandle?(filePerm==="granted"?`<button class="btn small" data-act="unlink">Stop auto-saving</button>`:`<button class="btn small primary" data-act="reconnect">Reconnect</button><button class="btn small" data-act="unlink">Unlink</button>`):`<button class="btn small" data-act="link">Auto-save to a file&hellip;</button>`}</div>`:""}
    </div>
    <div class="panel"><h3>Posters &amp; details</h3>
      <p>${missing?`${missing} title${missing===1?"":"s"} still need posters, genres, and runtimes from OMDb.`:"Every title has been looked up."}</p>
      <div class="acts"><button class="btn" data-act="fetch" ${missing&&!bulkRunning?"":"disabled"}>Fetch missing details</button><button class="btn" data-act="refetch">Re-fetch all</button></div>
      <div class="progress" id="libProgress"></div>
    </div>
    <div class="panel"><h3>Safety snapshots</h3>
      <p>Each time a new version of the app opens for the first time, it saves an untouched copy of your library here first (the last 5 are kept). If an update ever loses or garbles a rating, restore the copy from just before it.</p>
      <div id="snapList" class="progress">Loading&hellip;</div></div>
    <div class="panel"><h3>Export</h3><p>A spreadsheet copy of everything, for Google Sheets or Excel.</p><div class="acts"><button class="btn" data-act="csv">Download CSV</button></div></div>`}
    <div class="acts"><button class="btn ghost small" data-act="theme">${theme==="dark"?"Light":"Dark"} theme</button></div>
  </div>`;
  $("[data-close]",body).onclick=()=>$("#dLib").close();
  if(!IS_VIEWER) kvGet("snapshots").then(snaps=>{
    const el=$("#snapList"); if(!el) return;
    snaps=snaps||[];
    if(!snaps.length){el.textContent="None yet. One is saved the next time the app is updated.";return}
    el.innerHTML=snaps.map((x,i)=>`<div class="c" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dotted var(--rule)"><span>${new Date(x.savedAt).toLocaleString()} · ${x.titles} titles</span><button class="btn small" data-snap="${i}">Restore</button></div>`).join("");
    $$("[data-snap]",el).forEach(b=>b.onclick=async()=>{
      const x=snaps[+b.dataset.snap];
      if(!confirm(`Replace your current library with the copy from ${new Date(x.savedAt).toLocaleString()}? Changes made since then will be lost, so download a backup first if unsure.`)) return;
      lib=structuredClone(x.data); lib.appVersion=APP_VERSION; lib.entries=lib.entries.map(normalize); lib.meta=lib.meta||{};
      await persist(true); render(); renderLib(); toast("Library restored from snapshot");
    });
  }).catch(()=>{const el=$("#snapList");if(el)el.textContent="Unavailable in this browser mode."});
  $$("[data-act]",body).forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="backup") downloadBackup(), renderLib();
    if(a==="import") $("#fileIn").click();
    if(a==="link") linkFile();
    if(a==="reconnect") reconnectFile();
    if(a==="unlink") unlinkFile();
    if(a==="fetch") {fetchAllMissing();renderLib()}
    if(a==="refetch") {if(confirm("Look up every title again? Titles whose details you edited by hand are skipped.")){lib.entries.forEach(e=>{if(!e.metaManual)e.metaFetched=false});fetchAllMissing();renderLib()}}
    if(a==="csv") exportCSV();
    if(a==="theme") {setTheme(theme==="dark"?"light":"dark");renderLib()}
  });
}
function exportCSV(){
  const cols=["Spine","Title","Year","Type","Status","Score",...ALL_CATS.map(c=>c.n),"Standout","Seasons","Genre","Runtime","Director","Notes"];
  const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
  const rows=[...lib.entries].sort((a,b)=>(a.spine||1e9)-(b.spine||1e9)||a.title.localeCompare(b.title)).map(e=>[e.spine||"",e.title,e.year||"",typeLabel(e.type),e.status,e.overall??"",...ALL_CATS.map(c=>e.scores[c.k]??""),e.standout.map(k=>ALL_CATS.find(c=>c.k===k)?.n).join("; "),e.seasons.map(x=>`S${x.n} ${x.overall!=null?fmt(x.overall):"unrated"}`).join("; "),e.genre,e.runtime,e.director,e.note]);
  const blob=new Blob([[cols,...rows].map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="movie-monologue.csv";document.body.appendChild(a);a.click();a.remove();
}
function setTheme(t){document.documentElement.dataset.theme=t;lsSet("mm-theme",t);$('meta[name=theme-color]').content=t==="dark"?"#16130f":"#f3ede1"}

/* ---------------- boot ---------------- */
(async function(){
  setTheme(lsGet("mm-theme",matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
  if(IS_VIEWER){document.body.classList.add("viewer");$$(".edit-only").forEach(el=>el.classList.add("hide"));$("#viewerBar").classList.remove("hide")}
  await load();
  render();
  $$(".tab").forEach(t=>t.onclick=()=>{ui.view=t.dataset.view;lsSet("mm-view",ui.view);render()});
  $("#search").oninput=ev=>{ui.q=ev.target.value.trim();render()};
  $("#addBtn").onclick=()=>openEditor(null);
  $("#openLib").onclick=()=>{renderLib();$("#dLib").showModal()};
  $("#viewerLoad").onclick=()=>$("#fileIn").click();
  $("#fileIn").onchange=ev=>{const f=ev.target.files[0];if(f)importFile(f);ev.target.value=""};
  $$("dialog").forEach(d=>d.addEventListener("click",ev=>{if(ev.target===d)d.close()}));
  document.addEventListener("keydown",ev=>{if(ev.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$("dialog[open]")){ev.preventDefault();$("#search").focus()}});
  // first run: pull posters/details in the background
  if(!IS_VIEWER && lib.entries.some(e=>!e.metaFetched) && !lsGet("mm-autofetched","")){ lsSet("mm-autofetched","1"); fetchAllMissing(); }
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
